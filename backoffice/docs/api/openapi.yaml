      summary: '[DISPONIBLE] Modifier une salle'
      description: |
        Statut : **Disponible**

        Modifie le nom et/ou la configuration matérielle (la configuration envoyée remplace la
        précédente).

        Sécurité : le backoffice ne règle ni les lumières ni la fumée. La machine à fumée dépend de
        toute la section `lighting` (`smoke`, mais aussi `fixtures`, `customProfiles` et `bindings` :
        un appareil repassé en `par` à la même adresse de relais, un canal fumée rendu `binary`, une
        scène à fumée liée à `buzz`). Le `config` reçu est donc refusé (403 `smoke_config_forbidden`,
        tous rôles, superadmin compris) s'il change `lighting` par rapport à la configuration
        stockée, sauf pour couper la fumée : `lighting.smoke.enabled` de `true` à `false`, tout le
        reste de `lighting` identique. Une section `lighting` identique, un `config` sans `lighting`
        modifié, ou l'absence de `config`, passent ; le reste du `config` reste libre.

        Limite connue : cette garde ne couvre pas le compte de salle (`PUT /room/config`), dont le
        mot de passe est choisi par un admin ; vérifier côté poste de salle que la fumée a passé son
        test de coupure est un lot à part (S4, issue n° 152).

        La configuration n'est écrite que si elle n'a pas changé depuis la lecture faite pour cette
        vérification (409 `room_config_conflict` sinon : recharger puis réessayer).

