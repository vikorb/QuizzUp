  /questions/{questionId}/media:
    get:
      tags:
        - Questions
      summary: "[DISPONIBLE] Lire l'extrait audio d'une question"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Renvoie le fichier audio (flux binaire) d'une question. L'URL est protégée : le
        navigateur la charge avec `fetch` et l'en-tête `Authorization`, puis la lit en local
        (backoffice : pré-écoute ; écran de salle : préchargement de la partie).

        Règles :
        - mêmes droits de lecture que la question (scope global / company) ;
        - une question supprimée ne sert plus son fichier (404) ;
        - `Cache-Control: private, no-cache` + `Vary: Authorization` : chaque lecture est
          revalidée ; `ETag` = version du fichier, `If-None-Match` renvoie 304 ;
        - l'URL renvoyée dans `mediaFile.url` porte la version (`?v=`) et change à chaque upload.
      operationId: getQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Fichier audio
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-cache
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
        '304':
          description: Le navigateur a déjà cette version du fichier
        '403':
          description: Question non accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Question introuvable, supprimée, ou sans fichier (`question_media_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Questions
      summary: "[DISPONIBLE] Uploader ou remplacer l'extrait audio d'une question"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Le corps de la requête est le fichier lui-même (pas de multipart), avec son type MIME
        en `Content-Type`. Formats acceptés : mp3 (`audio/mpeg`, alias `audio/mp3`) et ogg
        (`audio/ogg`). Taille max : `MEDIA_MAX_BYTES` (10 Mo par défaut). La signature du
        fichier est vérifiée.

        Effets : la question passe en type média `audio`, `mediaUrl` est vidé, l'ancien
        fichier est supprimé du stockage. Le point de départ est conservé s'il tombe encore
        dans le nouveau fichier, sinon il revient à 0.

        Droits : permission `question:update` et droit de modifier la question (superadmin,
        ou admin pour les questions de sa compagnie). L'uploadeur atteste détenir le droit de
        diffuser le fichier (`rightsAttested=true`) : son libre de droits pour les thèmes
        éditeur, responsabilité du centre pour ses thèmes maison.
      operationId: uploadQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
        - name: rightsAttested
          in: query
          required: true
          description: Doit valoir `true`
          schema:
            type: string
            enum: ['true']
        - name: durationMs
          in: query
          required: false
          description: Durée du fichier en ms, mesurée par le navigateur au décodage
          schema:
            type: integer
            minimum: 1
            maximum: 3600000
        - name: fileName
          in: query
          required: false
          description: Nom d'origine du fichier (encodé URI), affiché dans le backoffice
          schema:
            type: string
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          description: |
            `question_media_required`, `question_media_invalid_file`,
            `question_media_rights_required`, `question_media_duration_invalid`,
            `question_kind_media_invalid` (l'audio est réservé aux questions QCM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Question non modifiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Question introuvable ou supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Fichier trop lourd
        '415':
          description: |
            Format non accepté. Si le `Content-Type` n'est pas audio, la réponse vient de Fastify
            (`FST_ERR_CTP_INVALID_MEDIA_TYPE`) ; un type audio hors mp3 / ogg renvoie
            `question_media_type_unsupported`.

    delete:
      tags:
        - Questions
      summary: "[DISPONIBLE] Retirer l'extrait audio d'une question"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Détache le fichier de la question, remet le point de départ à 0 et supprime le
        fichier du stockage. Le type média de la question n'est pas modifié.
      operationId: deleteQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Fichier retiré
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '404':
          description: Question introuvable, supprimée, ou sans fichier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

