  /public/v1/logos/{file}:
    get:
      tags:
        - Public
      summary: "[DISPONIBLE] Logo d'un centre"
      description: |
        Statut : **Disponible** (lot 6a)

        Route publique : aucune authentification. Sert le fichier (PNG, JPEG ou WebP) d'une
        compagnie non supprimée. Le nom du fichier change à chaque envoi : le contenu d'une URL ne
        change jamais, d'où le cache `immutable`. `Content-Type` vient de la base, avec
        `X-Content-Type-Options: nosniff`.

        Tout refus répond le même `404 logo_not_found` : fichier inconnu, nom mal formé, compagnie
        supprimée ou fichier absent du stockage ne se distinguent pas.
      operationId: getPublicCompanyLogo
      x-availability: disponible
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: Nom du fichier, `<uuid>.png`, `<uuid>.jpg` ou `<uuid>.webp` (voir `logoUrl`)
          schema:
            type: string
            example: 6f1c2a9e-3b7d-4c55-9a10-0d2f5b8e7a41.png
      responses:
        '200':
          description: Le logo
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Aucun logo pour ce fichier (`logo_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: Identifiant de la compagnie
      schema:
        type: integer
        example: 1

    RoomIdParam:
      name: roomId
      in: path
      required: true
      description: Identifiant de la salle
      schema:
        type: integer
        example: 1

    GameIdParam:
      name: gameId
      in: path
      required: true
      description: Identifiant de la partie
      schema:
        type: integer
        example: 1

    DemoRequestId:
      name: demoRequestId
      in: path
      required: true
      description: Identifiant de la demande de démonstration
      schema:
        type: integer
        example: 1

    CompanyIdParam:
      name: companyId
      in: path
      required: true
      description: Identifiant de la compagnie
      schema:
        type: integer
        example: 1

    AdminId:
      name: adminId
      in: path
      required: true
      description: Identifiant du compte administrateur
      schema:
        type: integer
        example: 1

    QuestionId:
      name: questionId
      in: path
      required: true
      description: Identifiant de la question
      schema:
        type: integer
        example: 1

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    QuestionImportError:
      type: object
      description: Erreur d'une ligne de l'import CSV de questions
      properties:
        line:
          type: integer
          description: Ligne physique où commence l'enregistrement (l'en-tête est la ligne 1)
        column:
          type: string
          nullable: true
          description: Colonne concernée, quand une seule l'est
        code:
          type: string
          description: |
            `csv_theme_not_found`, `csv_theme_ambiguous`, `csv_correct_invalid`,
            `csv_audio_unsupported`, `csv_media_url_required`, `csv_media_url_invalid`,
            `csv_question_duplicate`, `csv_too_many_columns`, ou un code de `POST /questions`
            (`question_required`, `question_theme_required`, `question_kind_invalid`,
            `question_type_media_invalid`, `question_kind_media_invalid`,
            `question_answers_min_required`, `question_correct_answer_required`,
            `question_true_false_answers_invalid`, `question_estimate_answers_invalid`)

    PublicError:
      type: object
      description: Erreur de l'API publique `/public/v1` (jamais de pile ni de message brut)
      required:
        - error
      properties:
        error:
          type: string
          description: Code stable en snake_case
          example: too_many_requests
        details:
          type: object
          description: Présent pour `invalid_body` seulement
          properties:
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    CreateDemoRequestRequest:
      type: object
      required:
        - name
        - centerName
        - email
        - roomsCount
        - consent
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Espaces de début et de fin retirés ; le caractère NUL (`\u0000`) est refusé
          example: Camille Martin
        centerName:
          type: string
          minLength: 1
          maxLength: 160
          description: Espaces de début et de fin retirés ; le caractère NUL (`\u0000`) est refusé
          example: Escape Test
        email:
          type: string
          format: email
          maxLength: 254
          example: camille@example.com
        phone:
          type: string
          pattern: '^[+0-9 ().-]{6,32}$'
          example: '+33 1 23 45 67 89'
        roomsCount:
          type: integer
          minimum: 1
          maximum: 50
          example: 3
        message:
          type: string
          maxLength: 2000
          description: >-
            Espaces de début et de fin retirés (un message vide est stocké comme absent) ;
            le caractère NUL (`\u0000`) est refusé
        consent:
          type: boolean
          enum: [true]
          description: Doit valoir `true` (consentement au traitement de la demande)
        website:
          type: string
          maxLength: 0
          description: Champ piège, laissé vide (invisible dans le formulaire)
        locale:
          type: string
          enum: [fr, en]

    DemoRequest:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
        centerName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        roomsCount:
          type: integer
        message:
          type: string
          nullable: true
        locale:
          type: string
          enum: [fr, en]
          nullable: true
        consentAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
        processedBy:
          type: integer
          nullable: true
          description: Compte superadmin qui a traité la demande (vide s'il a été supprimé)
        createdAt:
          type: string
          format: date-time

    DemoRequestsResponse:
      type: object
      properties:
        demoRequests:
          type: array
          items:
            $ref: '#/components/schemas/DemoRequest'
        pendingCount:
          type: integer
          description: Nombre de demandes non traitées
          example: 2

    UpdateDemoRequestRequest:
      type: object
      required:
        - processed
      properties:
        processed:
          type: boolean

    MediaProviderTrack:
      type: object
      description: Titre d'un fournisseur d'extraits, normalisé
      properties:
        provider:
          type: string
          enum: [deezer]
        ref:
          type: string
          pattern: '^[0-9]{1,20}$'
          example: '3135556'
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        coverUrl:
          type: string
          nullable: true
          description: Pochette (URL https), `null` si absente
        previewUrl:
          type: string
          nullable: true
          description: Extrait de 30 s (URL https signée, durée de vie courte, à ne pas enregistrer)
        link:
          type: string
          nullable: true
          description: Page du titre chez le fournisseur (URL https)

    QuestionMediaFile:
      type: object
      description: Fichier audio uploadé sur une question (la clé de stockage n'est jamais exposée)
      properties:
        url:
          type: string
          description: URL protégée de lecture, relative à l'API
          example: /questions/12/media?v=3f6c2a8e-9b1d-4c47-8e2f-5a0d7c1b9e44
        mimeType:
          type: string
          enum: [audio/mpeg, audio/ogg]
        sizeBytes:
          type: integer
          example: 482113
        durationMs:
          type: integer
          nullable: true
          example: 31000
        originalName:
          type: string
          nullable: true
          example: extrait.mp3
        uploadedAt:
          type: string
          format: date-time
          nullable: true

    Question:
      type: object
      properties:
        id:
          type: integer
        adminId:
          type: integer
        companyId:
          type: integer
          nullable: true
        scope:
          type: string
          enum: [global, company]
        question:
          type: string
        typeMedia:
          type: string
          enum: [none, image, audio, video]
        kind:
          type: string
          enum: [qcm, true_false, estimate]
          default: qcm
          description: |
            Type de question, utilisé par le moteur pour l'éligibilité des mini-jeux (`question_kind_invalid` sinon).
            Règles de réponses : `true_false` = exactement « Vrai » et « Faux », une seule juste
            (`question_true_false_answers_invalid`) ; `estimate` = 3 ou 4 fourchettes commençant par
            un nombre (« Moins de 100 », « 100 à 199 »), une seule juste (`question_estimate_answers_invalid`).
            Changer le type revalide les réponses existantes (actives ou en brouillon). Les routes
            unitaires `/questions/{questionId}/answers…` appliquent les mêmes règles à l'état final.
            Préfixes de fourchette reconnus : moins de, plus de, entre, de, environ, au moins, au plus,
            jusqu'à, avant, après, ou un symbole (<, >, ≤, ≥, ~).
            `true_false` et `estimate` n'acceptent que `typeMedia` `none` ou `image`
            (`question_kind_media_invalid` sinon) ; en modification, le champ non envoyé est pris en base.
        mediaUrl:
          type: string
          nullable: true
          description: Lien externe (image / vidéo). Vidé quand un fichier audio est uploadé.
        mediaStartMs:
          type: integer
          minimum: 0
          description: Point de départ de l'extrait audio, en ms
        mediaFile:
          allOf:
            - $ref: '#/components/schemas/QuestionMediaFile'
          nullable: true
        mediaProvider:
          type: string
          enum: [deezer]
          nullable: true
          description: |
            Fournisseur d'extraits de la question audio (au lieu d'un fichier importé), `null`
            sinon. Exclusif avec `mediaFile`. Posé par `PUT /questions/{questionId}/media/provider`,
            retiré par l'import d'un fichier, `DELETE /questions/{questionId}/media` ou un
            `typeMedia` autre que `audio`.
        mediaProviderRef:
          type: string
          nullable: true
          pattern: '^[0-9]{1,20}$'
          example: '3135556'
          description: Identifiant du titre chez le fournisseur ; `null` si `mediaProvider` l'est.
        mediaProviderLabel:
          type: string
          nullable: true
          maxLength: 255
          example: 'Queen — Bohemian Rhapsody'
          description: |
            Libellé « artiste — titre » enregistré au rattachement, pour afficher le titre sans
            interroger le fournisseur ; `null` si `mediaProvider` l'est.
        status:
          type: integer
          enum: [0, 1, 2, 3]
        themeIds:
          type: array
          items:
            type: integer
        canEdit:
          type: boolean

    UpdateQuestionRequest:
      type: object
      description: Tous les champs sont optionnels (seuls les champs du blind test sont détaillés)
      properties:
        question:
          type: string
        themeIds:
          type: array
          items:
            type: integer
        typeMedia:
          type: string
          enum: [none, image, audio, video]
        kind:
          type: string
          enum: [qcm, true_false, estimate]
          default: qcm
          description: |
            Type de question, utilisé par le moteur pour l'éligibilité des mini-jeux (`question_kind_invalid` sinon).
            Règles de réponses : `true_false` = exactement « Vrai » et « Faux », une seule juste
            (`question_true_false_answers_invalid`) ; `estimate` = 3 ou 4 fourchettes commençant par
            un nombre (« Moins de 100 », « 100 à 199 »), une seule juste (`question_estimate_answers_invalid`).
            Changer le type revalide les réponses existantes (actives ou en brouillon). Les routes
            unitaires `/questions/{questionId}/answers…` appliquent les mêmes règles à l'état final.
            Préfixes de fourchette reconnus : moins de, plus de, entre, de, environ, au moins, au plus,
            jusqu'à, avant, après, ou un symbole (<, >, ≤, ≥, ~).
            `true_false` et `estimate` n'acceptent que `typeMedia` `none` ou `image`
            (`question_kind_media_invalid` sinon) ; en modification, le champ non envoyé est pris en base.
        mediaUrl:
          type: string
          nullable: true
        mediaStartMs:
          type: integer
          minimum: 0
          description: |
            Point de départ de l'extrait en ms. Doit être un entier positif, inférieur à la
            durée du fichier si elle est connue (`question_media_start_invalid`,
            `question_media_start_out_of_range`) ; refusé sans fichier (`question_media_not_found`).
            Passer `typeMedia` à une autre valeur que `audio` détache et supprime le fichier.
          example: not_found

    ValidationError:
      type: object
      description: Erreur de validation retournée par Zod ou par l'API
      additionalProperties: true

    Status:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Statut :
        - `0` : inactif
        - `1` : actif
        - `2` : supprimé

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email ou nom d'utilisateur
          example: admin@quizzup.fr
        password:
          type: string
          format: password
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        admin:
          $ref: '#/components/schemas/AuthAdmin'

    LoginChallengeResponse:
      type: object
      description: Défi de double authentification d'un superadmin (aucune session créée)
      required:
        - mfa
        - challengeToken
      properties:
        mfa:
          type: string
          enum: [totp, enroll]
          description: "`totp` : saisir le code de l'application ; `enroll` : enrôler l'application"
        challengeToken:
          type: string
          description: Jeton de défi, valable 5 minutes, refusé comme jeton porteur

    TotpChallengeRequest:
      type: object
      required:
        - challengeToken
      properties:
        challengeToken:
          type: string

    TotpChallengeCodeRequest:
      type: object
      required:
        - challengeToken
        - code
      properties:
        challengeToken:
          type: string
        code:
          type: string
          description: |
            Code à 6 chiffres. `POST /login/totp` accepte aussi un code de secours `xxxxx-xxxxx` ;
            `POST /login/totp/enroll/confirm` exige exactement 6 chiffres.
          example: '123456'

    TotpCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Code à 6 chiffres ou code de secours `xxxxx-xxxxx`
          example: '123456'

    TotpEnrollResponse:
      type: object
      required:
        - secret
        - otpauthUrl
      properties:
        secret:
          type: string
          description: Secret en base32, à saisir dans l'application
          example: JBSWY3DPEHPK3PXP
        otpauthUrl:
          type: string
          description: Adresse `otpauth://totp/...` (émetteur `TOTP_ISSUER`, `QuizzUp` par défaut) pour un code QR
          example: otpauth://totp/QuizzUp:root?secret=JBSWY3DPEHPK3PXP&issuer=QuizzUp

    TotpConfirmResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
        - type: object
          required:
            - recoveryCodes
          properties:
            recoveryCodes:
              type: array
              description: Dix codes de secours, rendus une seule fois
              items:
                type: string
                example: abcde-fghij

    AuthAdmin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        role:
          type: string
          example: admin
        firstname:
          type: string
