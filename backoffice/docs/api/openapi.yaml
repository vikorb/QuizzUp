openapi: 3.0.3

info:
  title: QuizzUp Backoffice API
  version: 1.0.0
  description: |
    Documentation API du backoffice QuizzUp.

    Chaque route contient un champ `x-availability` :
    - `disponible` : route implémentée côté API
    - `non_disponible` : route prévue mais pas encore implémentée

servers:
  - url: http://localhost:3001
    description: API locale

tags:
  - name: Health
    description: Vérification de disponibilité de l'API
  - name: Auth
    description: Authentification administrateur
  - name: Me
    description: Informations de l'utilisateur connecté
  - name: Companies
    description: Gestion des compagnies
  - name: Accounts
    description: Gestion des comptes administrateurs rattachés aux compagnies
  - name: Rooms
    description: Salles de jeu d'une compagnie et leur configuration matérielle
  - name: Games
    description: Parties lancées par l'opérateur dans une salle

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: "[DISPONIBLE] Vérifier l'état de l'API"
      description: |
        Statut : **Disponible**

        Permet de vérifier que l'API répond correctement.
      operationId: getHealth
      x-availability: disponible
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /login:
    post:
      tags:
        - Auth
      summary: '[DISPONIBLE] Connexion administrateur'
      description: |
        Statut : **Disponible**

        Permet à un administrateur de se connecter avec son email ou son nom d'utilisateur.
      operationId: login
      x-availability: disponible
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              loginWithEmail:
                summary: Connexion avec email
                value:
                  identifier: admin@quizzup.fr
                  password: password123
              loginWithUsername:
                summary: Connexion avec username
                value:
                  identifier: admin
                  password: password123
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags:
        - Auth
      summary: '[DISPONIBLE] Déconnexion administrateur'
      description: |
        Statut : **Disponible**

        Révoque la session courante de l'administrateur connecté.
      operationId: logout
      x-availability: disponible
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags:
        - Me
      summary: "[DISPONIBLE] Récupérer l'utilisateur connecté"
      description: |
        Statut : **Disponible**

        Retourne les informations de l'administrateur connecté à partir du token JWT.
      operationId: getMe
      x-availability: disponible
      responses:
        '200':
          description: Utilisateur connecté récupéré
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    $ref: '#/components/schemas/MeAdmin'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Administrateur introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies:
    get:
      tags:
        - Companies
      summary: '[DISPONIBLE] Lister les compagnies'
      description: |
        Statut : **Disponible**

        Liste les compagnies.

        Règles :
        - un admin global peut voir toutes les compagnies ;
        - un compte non admin ne voit que sa propre compagnie si elle n'est pas supprimée.
      operationId: listCompanies
      x-availability: disponible
      responses:
        '200':
          description: Liste des compagnies
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Companies
      summary: '[DISPONIBLE] Créer une compagnie'
      description: |
        Statut : **Disponible**

        Crée une nouvelle compagnie.

        Accès : réservé au rôle `admin`.
      operationId: createCompany
      x-availability: disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Compagnie créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou nom déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{id}:
    get:
      tags:
        - Companies
      summary: '[DISPONIBLE] Récupérer une compagnie'
      description: |
        Statut : **Disponible**

        Récupère une compagnie par son identifiant.

        Règles :
        - un admin global peut accéder à toutes les compagnies ;
        - un compte non admin ne peut accéder qu'à sa propre compagnie.
      operationId: getCompanyById
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Compagnie récupérée
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Companies
      summary: '[DISPONIBLE] Modifier une compagnie'
      description: |
        Statut : **Disponible**

        Modifie une compagnie.

        Accès : réservé au rôle `admin`.
      operationId: updateCompany
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Compagnie modifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou nom déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{id}/status:
    patch:
      tags:
        - Companies
      summary: "[DISPONIBLE] Modifier le statut d'une compagnie"
      description: |
        Statut : **Disponible**

        Met à jour uniquement le statut d'une compagnie.

        Statuts :
        - `0` : inactive
        - `1` : active
        - `2` : supprimée

        Si le statut passe à `2`, `deletedAt` est renseigné.
      operationId: updateCompanyStatus
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Statut de la compagnie modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{id}/permanent:
    delete:
      tags:
        - Companies
      summary: '[DISPONIBLE] Supprimer une compagnie'
      description: |
        Statut : **Disponible**

        Supprime une compagnie de manière logique.

        Important :
        malgré le nom de route `/permanent`, l'API actuelle ne supprime pas physiquement la ligne.
        Elle passe la compagnie au statut `2` et renseigne `deletedAt`.

        Accès : réservé au rôle `admin`.
      operationId: deleteCompany
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Compagnie supprimée logiquement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCompanyResponse'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{id}/admins:
    get:
      tags:
        - Accounts
      summary: "[DISPONIBLE] Lister les comptes d'une compagnie"
      description: |
        Statut : **Disponible**

        Liste les comptes administrateurs rattachés à une compagnie.

        Règles :
        - un admin global peut accéder à toutes les compagnies ;
        - un compte non admin peut accéder aux comptes de sa propre compagnie.
      operationId: listCompanyAccounts
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Liste des comptes
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/admins:
    post:
      tags:
        - Accounts
      summary: '[DISPONIBLE] Créer un compte'
      description: |
        Statut : **Disponible**

        Crée un compte administrateur dans une compagnie.

        Accès : réservé au rôle `admin`.
      operationId: createCompanyAccount
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou username déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/admins/{adminId}:
    get:
      tags:
        - Accounts
      summary: '[DISPONIBLE] Récupérer un compte'
      description: |
        Statut : **Disponible**

        Récupère un compte administrateur par son identifiant.

        Accès : réservé au rôle `admin`.
      operationId: getCompanyAccountById
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: Compte récupéré
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou compte introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Accounts
      summary: '[DISPONIBLE] Modifier un compte'
      description: |
        Statut : **Disponible**

        Modifie les informations d'un compte administrateur.

        Accès : réservé au rôle `admin`.
      operationId: updateCompanyAccount
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Compte modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou compte introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou username déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Accounts
      summary: '[DISPONIBLE] Supprimer un compte'
      description: |
        Statut : **Disponible**

        Supprime un compte de manière logique.

        L'API passe le compte au statut `2` et renseigne `deletedAt`.

        Accès : réservé au rôle `admin`.
      operationId: deleteCompanyAccount
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: Compte supprimé logiquement
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou compte introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/admins/{adminId}/status:
    patch:
      tags:
        - Accounts
      summary: "[DISPONIBLE] Modifier le statut d'un compte"
      description: |
        Statut : **Disponible**

        Met à jour uniquement le statut d'un compte administrateur.

        Statuts :
        - `0` : inactif
        - `1` : actif
        - `2` : supprimé

        Si le statut passe à `2`, `deletedAt` est renseigné.

        Accès : réservé au rôle `admin`.
      operationId: updateCompanyAccountStatus
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Statut du compte modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou compte introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: '[NON DISPONIBLE] Récupérer les statistiques du dashboard'
      description: |
        Statut : **Non disponible**

        Route prévue pour afficher les indicateurs principaux du backoffice :
        - nombre de compagnies
        - nombre de comptes
        - nombre de joueurs
        - nombre de parties
        - activité récente
      operationId: getDashboardStats
      x-availability: non_disponible
      x-us: 'US Dashboard / statistiques'
      responses:
        '200':
          description: Statistiques du dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '501':
          description: Route prévue mais pas encore implémentée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedResponse'

  /companies/{companyId}/rooms:
    get:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Lister les salles d'une compagnie"
      description: |
        Statut : **Disponible**

        Chaque salle porte son nombre de pupitres (`desksCount`, 4 par défaut, de 1 à 6).

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie (lecture).
      operationId: listCompanyRooms
      x-availability: disponible
      x-us: 'US-ROOM-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      responses:
        '200':
          description: Salles de la compagnie (les salles supprimées ne sont visibles que du superadmin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Room'
                        - type: object
                          properties:
                            desksCount:
                              type: integer
                              minimum: 1
                              maximum: 6
                              example: 4
                              description: >-
                                Pupitres de la salle, lus dans `config.desksCount` (4 par défaut,
                                de 1 à 6). Le formulaire de lancement d'une partie ne propose que ceux-là.
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou salle introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Créer une salle'
      description: |
        Statut : **Disponible**

        Crée une salle active. La configuration matérielle est vide par défaut.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie.
      operationId: createCompanyRoom
      x-availability: disponible
      x-us: 'US-ROOM-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Salle créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou salle introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Nom de salle déjà utilisé dans la compagnie (`room_name_already_exists`) ou compagnie supprimée (`company_deleted`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/rooms/{roomId}:
    get:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Lire une salle'
      description: |
        Statut : **Disponible**

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie (lecture).
      operationId: getCompanyRoom
      x-availability: disponible
      x-us: 'US-ROOM-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: Salle
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou salle introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Modifier une salle'
      description: |
        Statut : **Disponible**

        Modifie le nom et/ou la configuration matérielle.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie.
      operationId: updateCompanyRoom
      x-availability: disponible
      x-us: 'US-ROOM-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/RoomIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
