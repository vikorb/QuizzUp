  /media-catalog/tracks:
    get:
      tags:
        - Questions
      summary: "[DISPONIBLE] Rechercher un titre chez le fournisseur d'extraits"
      description: |
        Statut : **Disponible** (US-AUDIO-03)

        Interroge l'API publique du fournisseur d'extraits (Deezer, adresse réglée par
        `DEEZER_API_BASE_URL`) et rend les titres trouvés, sans ceux qui n'ont pas d'extrait. Le
        serveur ne télécharge ni ne stocke jamais l'audio. `previewUrl` est un lien d'extrait de
        30 secondes, signé et à durée de vie courte : à n'utiliser que pour la pré-écoute, jamais
        à enregistrer (la question garde seulement `provider` et `ref`).

        Droits : permission `question:update`, comme le rattachement d'un extrait.
      operationId: searchMediaCatalogTracks
      x-availability: disponible
      x-us: 'US-AUDIO-03'
      parameters:
        - name: q
          in: query
          required: true
          description: Recherche, 2 à 100 caractères (espaces de bord ignorés)
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Nombre de titres demandés au fournisseur
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: Titres trouvés (liste vide si aucun)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaProviderTrack'
        '400':
          description: Recherche ou limite invalide (`invalid_query`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Rôle sans droit de modifier les questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fournisseur indisponible (délai, réseau, erreur ou réponse invalide) (`media_provider_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /questions/{questionId}/media/provider:
    put:
      tags:
        - Questions
      summary: "[DISPONIBLE] Rattacher une question audio à un titre du fournisseur d'extraits"
      description: |
        Statut : **Disponible** (US-AUDIO-03)

        Remplace le fichier importé par un titre du fournisseur d'extraits (Deezer). Le serveur
        vérifie le titre chez le fournisseur puis n'enregistre que sa référence
        (`mediaProvider`, `mediaProviderRef`) : il ne télécharge ni ne stocke l'audio, et le lien
        d'extrait, signé et à durée de vie courte, n'est jamais enregistré (il est redemandé à
        chaque envoi du catalogue à la salle).

        Effets : la question passe en type média `audio`, `mediaUrl` et les colonnes du fichier
        importé sont vidés (le fichier est supprimé du stockage s'il y en avait un), la durée est
        fixée à 30 000 ms, le point de départ à 0, `mediaFile` vaut `null`. Le nom d'origine
        affiché est « artiste — titre ». Rien n'est modifié si le fournisseur répond une erreur.

        Droits : mêmes que `PUT /questions/{questionId}/media` (permission `question:update` et
        droit de modifier la question) ; l'audio reste réservé aux questions QCM.
      operationId: attachQuestionMediaProvider
      x-availability: disponible
      x-us: 'US-AUDIO-03'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, ref]
              properties:
                provider:
                  type: string
                  enum: [deezer]
                ref:
                  type: string
                  pattern: '^[0-9]{1,20}$'
                  example: '3135556'
      responses:
        '200':
          description: Titre rattaché
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          description: |
            `question_media_provider_invalid` (fournisseur inconnu, référence absente ou non
            numérique), `question_id_invalid`, `question_kind_media_invalid` (l'audio est réservé
            aux questions QCM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Question non modifiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `question_not_found` (introuvable ou supprimée) ou
            `question_media_provider_track_not_found` (titre inconnu du fournisseur)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Le titre n'a pas d'extrait (`question_media_provider_no_preview`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fournisseur indisponible (`media_provider_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /questions/{questionId}/media:
    get:
      tags:
        - Questions
      summary: "[DISPONIBLE] Lire l'extrait audio d'une question"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Renvoie le fichier audio (flux binaire) d'une question. L'URL est protégée : le
        navigateur la charge avec `fetch` et l'en-tête `Authorization`, puis la lit en local
        (backoffice : pré-écoute ; écran de salle : préchargement de la partie).

        Règles :
        - mêmes droits de lecture que la question (scope global / company) ;
        - une question supprimée ne sert plus son fichier (404) ;
        - `Cache-Control: private, no-cache` + `Vary: Authorization` : chaque lecture est
          revalidée ; `ETag` = version du fichier, `If-None-Match` renvoie 304 ;
        - l'URL renvoyée dans `mediaFile.url` porte la version (`?v=`) et change à chaque upload.
      operationId: getQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Fichier audio
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-cache
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
        '304':
          description: Le navigateur a déjà cette version du fichier
        '403':
          description: Question non accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Question introuvable, supprimée, ou sans fichier (`question_media_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Questions
      summary: "[DISPONIBLE] Uploader ou remplacer l'extrait audio d'une question"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Le corps de la requête est le fichier lui-même (pas de multipart), avec son type MIME
        en `Content-Type`. Formats acceptés : mp3 (`audio/mpeg`, alias `audio/mp3`) et ogg
        (`audio/ogg`). Taille max : `MEDIA_MAX_BYTES` (10 Mo par défaut). La signature du
        fichier est vérifiée.

        Effets : la question passe en type média `audio`, `mediaUrl` est vidé, l'ancien
        fichier est supprimé du stockage, un éventuel titre de fournisseur d'extraits
        (`mediaProvider`, `mediaProviderRef`) est retiré. Le point de départ est conservé s'il
        tombe encore dans le nouveau fichier, sinon il revient à 0.

        Droits : permission `question:update` et droit de modifier la question (superadmin,
        ou admin pour les questions de sa compagnie). L'uploadeur atteste détenir le droit de
        diffuser le fichier (`rightsAttested=true`) : son libre de droits pour les thèmes
        éditeur, responsabilité du centre pour ses thèmes maison.
      operationId: uploadQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
        - name: rightsAttested
          in: query
          required: true
          description: Doit valoir `true`
          schema:
            type: string
            enum: ['true']
        - name: durationMs
          in: query
          required: false
          description: Durée du fichier en ms, mesurée par le navigateur au décodage
          schema:
            type: integer
            minimum: 1
            maximum: 3600000
        - name: fileName
          in: query
          required: false
          description: Nom d'origine du fichier (encodé URI), affiché dans le backoffice
          schema:
            type: string
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          description: |
            `question_media_required`, `question_media_invalid_file`,
            `question_media_rights_required`, `question_media_duration_invalid`,
            `question_kind_media_invalid` (l'audio est réservé aux questions QCM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Question non modifiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Question introuvable ou supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Fichier trop lourd
        '415':
          description: |
            Format non accepté. Si le `Content-Type` n'est pas audio, la réponse vient de Fastify
            (`FST_ERR_CTP_INVALID_MEDIA_TYPE`) ; un type audio hors mp3 / ogg renvoie
            `question_media_type_unsupported`.

    delete:
      tags:
        - Questions
      summary: "[DISPONIBLE] Retirer l'extrait audio d'une question"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Détache le fichier de la question (ou son titre d'un fournisseur d'extraits, cf.
        `PUT /questions/{questionId}/media/provider`), remet le point de départ à 0 et supprime
        le fichier du stockage. Le type média de la question n'est pas modifié.
      operationId: deleteQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Fichier retiré
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '404':
          description: Question introuvable, supprimée, ou sans fichier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

