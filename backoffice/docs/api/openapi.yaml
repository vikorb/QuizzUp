    Company:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: QuizzUp
        email:
          type: string
          format: email
          example: contact@quizzup.fr
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        accountsCount:
          type: integer
          example: 3
        logoUrl:
          type: string
          nullable: true
          description: URL publique du logo (`GET /public/v1/logos/{file}`), ou `null` sans logo
          example: /public/v1/logos/6f1c2a9e-3b7d-4c55-9a10-0d2f5b8e7a41.png

    CreateCompanyRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: QuizzUp
        email:
          type: string
          format: email
          maxLength: 255
          example: contact@quizzup.fr

    UpdateCompanyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: QuizzUp
        email:
          type: string
          format: email
          maxLength: 255
          example: contact@quizzup.fr
        status:
          $ref: '#/components/schemas/Status'

    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Status'

    DeleteCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        deleted:
          type: object
          properties:
            companyId:
              type: integer
              example: 1
            adminsCount:
              type: integer
              example: 0
            companiesCount:
              type: integer
              example: 1

    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        companyId:
          type: integer
          example: 1
        name:
          type: string
          example: Salle Néon
        config:
          type: object
          additionalProperties: true
          description: >-
            Configuration matérielle (buzzers, lumières, fumée), JSON libre de 20 000 caractères max.
            `desksCount` (entier de 1 à 6, 4 par défaut) fixe le nombre de pupitres de la salle.
          example: { desksCount: 4 }
        configRevision:
          type: integer
          minimum: 0
          description: >-
            Révision de `config` : 0 à la création, +1 à chaque écriture (`PUT /room/config`, ou
            `PATCH` du backoffice qui modifie `config`). À renvoyer dans `revision` de `PUT /room/config`.
          example: 3
        schedule:
          allOf:
            - $ref: '#/components/schemas/RoomSchedule'
          nullable: true
          description: >-
            Réglages de créneaux de la salle, écrits par `PUT /companies/{companyId}/rooms/{roomId}/schedule` ;
            `null` : pas de créneaux, salle non réservable.
        status:
          type: integer
          enum: [0, 1, 2]
          description: '`0` inactive, `1` active, `2` supprimée'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true

    RoomScheduleDay:
      type: object
      description: >-
        Horaires d'un jour, au format `HH:MM` sur 24 h, en heure locale de la
        salle. `closesAt` ≤ `opensAt` veut dire « ferme le lendemain » (24 h d'ouverture au plus).
        `firstSessionAt` doit tomber dans la plage d'ouverture ; il vaut `opensAt` s'il est absent.
      required: [opensAt, closesAt]
      properties:
        opensAt:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '10:00'
        firstSessionAt:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '10:30'
        closesAt:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'

    RoomSchedule:
      type: object
      description: >-
        Réglages de créneaux d'une salle (`rooms.schedule`). Tout est stocké en
        UTC ; le fuseau de la salle sert à lire les horaires. Deux jours consécutifs ne doivent pas se
        chevaucher (une fermeture après minuit au-delà de l'ouverture du lendemain est refusée).
      required: [timezone, slotMinutes, breakMinutes, bookableDesks, publicBooking, days]
      properties:
        timezone:
          type: string
          description: >-
            Fuseau IANA (`Europe/Paris`, `UTC`). Les décalages fixes (`+01:00`) et les abréviations sans `/` (`EST`,
            `CET`) sont refusés (`schedule_timezone_invalid`). Le nom est stocké normalisé (`europe/paris` devient
            `Europe/Paris`). Défaut proposé `Europe/Paris`.
          example: Europe/Paris
        slotMinutes:
          type: integer
          minimum: 10
          maximum: 240
          description: Durée d'un créneau en minutes (`SESSION_MIN_MINUTES` à `SESSION_MAX_MINUTES`).
          example: 60
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 120
          default: 0
          description: Pause entre deux créneaux (`SESSION_MAX_BREAK_MINUTES` au plus), `0` pour des créneaux bout à bout.
        bookableDesks:
          type: integer
          minimum: 1
          maximum: 6
          description: >-
            Pupitres ouverts à la réservation. Valeur effective :
            `min(bookableDesks, nombre de pupitres de la salle)`.
          example: 4
        publicBooking:
          type: boolean
          description: La salle apparaît dans l'API publique de réservation.
        days:
          type: object
          description: >-
            Jours ISO, clés `"1"` (lundi) à `"7"` (dimanche), pas d'autre clé. Une clé absente veut
            dire jour fermé.
          additionalProperties:
            $ref: '#/components/schemas/RoomScheduleDay'
          example:
            '1': { opensAt: '10:00', closesAt: '22:00' }
            '6': { opensAt: '10:00', firstSessionAt: '10:30', closesAt: '01:00' }

    UpdateRoomScheduleRequest:
      type: object
      description: '`schedule: null` désactive les créneaux de la salle.'
      required: [schedule]
      properties:
        schedule:
          allOf:
            - $ref: '#/components/schemas/RoomSchedule'
          nullable: true

    UpdateGameRequest:
      type: object
      description: >-
        Au moins un champ (`400 invalid_body` sinon) ; les champs absents sont gardés. Seule une
        session `scheduled` se modifie. `participants` remplace la liste complète (même forme que
        `CreateGameRequest`, de 0 à 6 participants). `playersCount`, `externalRef` et `locale`
        acceptent `null` pour être effacés. `miniGames` : la liste complète est enregistrée comme
        `null` (tous les mini-jeux). `scheduledAt` sans `durationMinutes` garde la durée de la
        session, `durationMinutes` sans `scheduledAt` garde son début.
      properties:
        roomId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
          description: Date ISO 8601 avec décalage, à la minute près (secondes à 0).
        durationMinutes:
          type: integer
          minimum: 10
          maximum: 240
        roundsCount:
          type: integer
          minimum: 1
          maximum: 20
        questionsPerRound:
          type: integer
          minimum: 1
          maximum: 20
        miniGames:
          type: array
          items:
            type: string
        playersCount:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
        externalRef:
          type: string
          maxLength: 100
          nullable: true
        locale:
          type: string
          enum: [fr, en]
          nullable: true
        participants:
          type: array
          maxItems: 6
          items:
            type: object

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: Salle Néon
        config:
          type: object
          additionalProperties: true

    UpdateRoomRequest:
      type: object
      description: Au moins un champ est requis.
      properties:
        name:
          type: string
          maxLength: 255
        config:
          type: object
          additionalProperties: true

    UpdateRoomStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1, 2]

    RoomAccount:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        roomId:
          type: integer
        username:
          type: string
          example: salle-neon
        status:
          type: integer
          enum: [0, 1, 2]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateRoomAccountRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 255
          pattern: "^[\\w.-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 100

    RoomLogEntry:
      type: object
      description: Une erreur envoyée par l'écran de salle (`POST /room/logs`)
      required: [level, code, message, occurredAt]
      properties:
        level:
          type: string
          enum: [error, warn]
        code:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]*$'
          description: Code stable en `snake_case`
          example: dmx_output_error
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: Adresses e-mail masquées (`[email]`) avant la coupe à 300 caractères
        context:
          type: object
          additionalProperties: true
          description: >-
            Forme libre à l'envoi ; seules les clés `route`, `phase`, `miniGame`, `desk`, `driver`
            et `httpStatus` sont gardées (texte de 64 caractères au plus ou nombre).
          example:
            driver: usbpro
            desk: 2
        occurrences:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
          description: Répétitions regroupées par l'écran de salle
        occurredAt:
          type: string
          format: date-time
          description: Première occurrence, heure du poste de la salle

    RoomLog:
      type: object
      description: Une erreur de salle enregistrée, telle que le personnel la lit
      required: [id, level, code, message, context, appVersion, occurrences, occurredAt, createdAt]
      properties:
        id:
          type: integer
        level:
          type: string
          enum: [error, warn]
        code:
          type: string
          example: dmx_output_error
        message:
          type: string
        context:
          type: object
          nullable: true
          additionalProperties: true
          description: Clés `route`, `phase`, `miniGame`, `desk`, `driver`, `httpStatus` ; `null` s'il n'en reste aucune
        appVersion:
          type: string
        occurrences:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
          description: Première occurrence, heure du poste de la salle (jamais dans le futur)
        createdAt:
          type: string
          format: date-time
          description: Réception par le serveur

    MiniGame:
      type: string
      description: Code d'un mini-jeu du moteur de jeu (voir `MINI_GAMES` dans `@quizzup/shared`)
      enum:
        - flash_blind_test
        - quick_answer
        - first_buzz
        - true_false
        - double_or_nothing
        - sudden_death
        - point_steal
        - streak
        - estimate
        - progressive_reveal

    CompanyStats:
      type: object
      description: Statistiques d'exploitation d'une compagnie sur une période. Agrégats seulement, aucune donnée de joueur.
      required: [period, sessions, players, busiestSlots]
      properties:
        period:
          type: object
          required: [from, to, timeZone]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
              description: Exclue.
            timeZone:
              type: string
              example: Europe/Paris
        sessions:
          type: object
          required: [finished, aborted, abandonRate, medianDurationSeconds, byRoom]
          properties:
            finished:
              type: integer
              minimum: 0
            aborted:
              type: integer
              minimum: 0
            abandonRate:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
              description: Arrêtées (démarrées) sur terminées et arrêtées ; `null` sans aucune session.
            medianDurationSeconds:
              type: integer
              nullable: true
              description: Durée réelle médiane d'une session terminée ; `null` si aucune.
            byRoom:
              type: array
              description: Salles ayant au moins une session terminée ou arrêtée, par nom.
              items:
                type: object
                required: [roomId, roomName, finished, aborted]
                properties:
                  roomId:
                    type: integer
                  roomName:
                    type: string
                  finished:
                    type: integer
                    minimum: 0
                  aborted:
                    type: integer
                    minimum: 0
        players:
          type: object
          required:
            - total
            - averagePerSession
            - withEmail
            - emailRate
            - withMarketingConsent
            - marketingConsentRate
            - distinctEmails
            - returningEmails
          properties:
            total:
              type: integer
              minimum: 0
              description: Joueurs des sessions terminées (pupitres et seconds joueurs nommés).
            averagePerSession:
              type: number
              nullable: true
              description: Une décimale ; `null` sans session terminée.
            withEmail:
              type: integer
              minimum: 0
            emailRate:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
            withMarketingConsent:
              type: integer
              minimum: 0
            marketingConsentRate:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
            distinctEmails:
              type: integer
              minimum: 0
              description: Adresses distinctes (minuscules, espaces retirés) vues sur la période.
            returningEmails:
              type: integer
              minimum: 0
              description: Adresses vues dans au moins deux sessions de la période.
        busiestSlots:
          type: array
          description: Dix créneaux au plus, du plus chargé au moins chargé (puis par jour et par heure). Sessions terminées, dans le fuseau demandé.
          items:
            type: object
            required: [weekday, hour, sessions]
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 = lundi, 7 = dimanche.
              hour:
                type: integer
                minimum: 0
                maximum: 23
              sessions:
                type: integer
                minimum: 1

    GameSummary:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        roomId:
          type: integer
        roomName:
          type: string
        adminId:
          type: integer
          description: Opérateur qui a lancé la partie
        roundsCount:
          type: integer
          example: 10
        questionsPerRound:
          type: integer
          example: 10
        miniGames:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MiniGame'
          description: >-
            Mini-jeux tirés au sort à chaque manche, avec la même probabilité (dans l'ordre de
            `MINI_GAMES`). `null` = tous les mini-jeux, y compris les futurs : c'est aussi ce qui est
            enregistré quand la création reçoit la liste complète. À la relecture, les codes
            inconnus sont ignorés et une liste qui devient vide est renvoyée comme `null`.
            Renvoyé aussi par `GET /room/games/current`.
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
        state:
          type: string
          enum: [scheduled, pending, running, finished, aborted, cancelled]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Début prévu (UTC), `null` pour une partie immédiate.
        scheduledEndAt:
          type: string
          format: date-time
          nullable: true
          description: Fin prévue (UTC), strictement après `scheduledAt`.
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: Renseigné si et seulement si `state` vaut `cancelled`.
        playersCount:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
          description: Nombre de joueurs annoncé à la réservation (6 pupitres × 2 joueurs au plus).
        externalRef:
          type: string
          maxLength: 100
          nullable: true
          description: Référence du système de réservation du client.
        locale:
          type: string
          enum: [fr, en]
          nullable: true
        status:
          type: integer
          enum: [0, 1, 2]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        participantsCount:
          type: integer
          description: Joueurs nommés (premier et second joueur de chaque pupitre). Liste des parties seulement.
        durationSeconds:
          type: integer
          nullable: true
          description: "`finishedAt − startedAt` en secondes ; `null` tant que la partie n'est pas terminée (arrêtée comprise). Liste des parties seulement."
        topScore:
          type: integer
          nullable: true
          description: Meilleur score des pupitres ; `null` tant que la partie n'est pas terminée ou sans participant. Liste des parties seulement.

    GameParticipant:
      type: object
      properties:
        id:
          type: integer
        podium:
          type: integer
          minimum: 1
          maximum: 6
        displayName:
          type: string
        email:
          type: string
          nullable: true
          description: Masqué (`null`) pour le rôle `user`, qui saisit l'email mais ne le relit pas
        consentAt:
          type: string
          format: date-time
          nullable: true
          description: Horodatage du consentement RGPD (obligatoire si un email est renseigné)
        marketingConsent:
          type: boolean
          description: Le joueur accepte de recevoir les offres du centre (jamais vrai sans email). Visible de tous les rôles, l'horodatage n'est pas exposé.
        hasEmail:
          type: boolean
          description: Un email est enregistré (même s'il est masqué pour le rôle `user`)
        secondPlayer:
          allOf:
            - $ref: '#/components/schemas/GameSecondPlayer'
          nullable: true
        score:
          type: integer
          description: Score du pupitre, partagé par ses joueurs

    GameSecondPlayer:
      type: object
      description: 2e joueur facultatif du pupitre, avec son propre email RGPD
      properties:
        displayName:
          type: string
        email:
          type: string
          nullable: true
          description: Masqué (`null`) pour le rôle `user`
        hasEmail:
          type: boolean
        consentAt:
          type: string
          format: date-time
          nullable: true
        marketingConsent:
          type: boolean
          description: Le 2e joueur accepte de recevoir les offres du centre (jamais vrai sans email)

    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/GameParticipant'

    RoomGame:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          properties:
            participants:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  podium:
                    type: integer
                  displayName:
                    type: string
                  secondDisplayName:
                    type: string
                    nullable: true
                    description: 2e joueur facultatif du pupitre
                  score:
                    type: integer

    CreateGameRequest:
      type: object
      required: [roomId]
      description: >-
        Sans `scheduledAt`, `participants` est requis (1 à 6). Avec `scheduledAt`, la partie est
        créée à l'état `scheduled`, `participants` peut être vide (0 à 6) et le contrôle
        `room_busy` ne s'applique pas. Seul le chevauchement d'une autre session de la salle est
        interdit (`slot_taken`) : une création manuelle peut sortir de la grille des créneaux.
      properties:
        scheduledAt:
          type: string
          format: date-time
          description: Date ISO 8601 avec décalage, à la minute près (secondes à 0).
          example: '2027-03-10T14:00:00+01:00'
        durationMinutes:
          type: integer
          minimum: 10
          maximum: 240
          description: >-
            Par défaut le `slotMinutes` de la salle, sinon 60. Refusé (`400 invalid_body`) sans
            `scheduledAt`.
        playersCount:
          type: integer
          minimum: 1
          maximum: 12
        externalRef:
          type: string
          maxLength: 100
        locale:
          type: string
          enum: [fr, en]
        roomId:
          type: integer
        roundsCount:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        questionsPerRound:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        miniGames:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MiniGame'
          description: >-
            Mini-jeux autorisés pour la partie. Facultatif : omis, la partie les autorise tous
            (stocké `null`) ; la liste complète est elle aussi enregistrée comme `null`, pour
            inclure d'office les futurs mini-jeux. Un code inconnu, un doublon ou un tableau
            vide donnent `400 invalid_body`.
        participants:
          type: array
          maxItems: 6
          description: >-
            Au moins un participant sans `scheduledAt`. Au plus autant de participants que la salle a de pupitres (`desksCount`, 4 par défaut,
            6 au maximum) ; un pupitre au-delà donne `400 podium_not_in_room`.
          items:
            type: object
            required: [podium, displayName]
            properties:
              podium:
                type: integer
                minimum: 1
                maximum: 6
              displayName:
                type: string
                maxLength: 100
              email:
                type: string
                format: email
                nullable: true
              emailConsent:
                type: boolean
                description: Case RGPD cochée explicitement ; requise si `email` est renseigné
              marketingConsent:
                type: boolean
                description: >-
                  Case « recevoir les offres du centre », distincte de `emailConsent` et facultative.
                  `true` sans `email` donne `400 marketing_consent_requires_email`. Le serveur
                  horodate lui-même.
              secondPlayer:
                type: object
                nullable: true
                description: 2e joueur facultatif du pupitre (même score que le 1er)
                required: [displayName]
                properties:
                  displayName:
                    type: string
                    maxLength: 100
                  email:
                    type: string
                    format: email
                    nullable: true
                  emailConsent:
                    type: boolean
                    description: Requise si `email` est renseigné
                  marketingConsent:
                    type: boolean
                    description: Offres du centre ; `true` sans `email` donne `400 marketing_consent_requires_email`

    Account:
      type: object
      properties:
        id:
          type: integer
          example: 1
        companyId:
          type: integer
          example: 1
        role:
