        Crée le compte de rôle `room` (un seul compte actif par salle). Il se connecte via `POST /login` avec son identifiant ; sa session n'expire pas par inactivité (jeton valable 365 jours). Un identifiant reste réservé après la suppression du compte. Une salle inactive garde son compte connecté mais ne peut pas recevoir de nouvelle partie.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie.
      operationId: createRoomAccount
