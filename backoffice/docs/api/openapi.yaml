        '403':
          description: Accès interdit, ou section `lighting` (lumières, fumée) modifiée autrement que par la coupure de la fumée (`smoke_config_forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie ou salle introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Nom de salle déjà utilisé dans la compagnie (`room_name_already_exists`), compagnie supprimée (`company_deleted`) ou configuration modifiée entre-temps (`room_config_conflict`)
          content:
            application/json:
              schema:
