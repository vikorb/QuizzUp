      summary: '[DISPONIBLE] Supprimer le compte de la salle'
      description: |
        Statut : **Disponible**

        Suppression logique du compte et révocation immédiate de ses sessions. La suppression d'une salle supprime aussi son compte et arrête ses parties en attente ou en cours.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie.
      operationId: deleteRoomAccount
