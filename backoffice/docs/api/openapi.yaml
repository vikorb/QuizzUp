        Erreurs que l'écran de salle a envoyées par `POST /room/logs`, de la plus récente à la plus ancienne. Pagination par `before` : l'`id` de la dernière ligne lue (les `id` décroissent). Aucun e-mail ni donnée de joueur : les adresses sont masquées (`[email]`) et le contexte se limite à `route`, `phase`, `miniGame`, `desk`, `driver` et `httpStatus`.

        Conservation : 30 jours (`ROOM_LOG_RETENTION_DAYS`) et 5000 lignes par salle au plus ; le nettoyage a lieu à chaque envoi de la salle. Les journaux disparaissent avec la salle. Une salle supprimée n'est lisible que du superadmin.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie. Le rôle `user` et le compte de salle reçoivent `403`.
      operationId: listCompanyRoomLogs
      x-availability: disponible
      x-us: 'US-LOG-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/RoomIdParam'
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [error, warn]
          description: Ne garder que ce niveau
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: '`id` de la dernière ligne déjà lue ; ne renvoie que les lignes plus anciennes'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Nombre de lignes renvoyées. Une valeur au-dessus de 200 est ramenée à 200.
      responses:
        '200':
          description: Journaux de la salle (liste vide s'il n'y en a pas)
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomLog'
        '400':
          description: Paramètres d'URL invalides (`invalid_params`) ou paramètres de requête invalides (`invalid_query`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non connecté ou session invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit (rôle sans droit de lecture des journaux, ou autre compagnie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle introuvable dans cette compagnie (`not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/rooms/{roomId}/account:
