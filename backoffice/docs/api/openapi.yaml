                      - $ref: '#/components/schemas/GameDetail'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Partie déjà terminée (`game_already_over`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/stats:
    get:
      tags:
        - Stats
      summary: "[DISPONIBLE] Statistiques d'exploitation d'une compagnie"
      description: |
        Statut : **Disponible** (lot 7d)

        Agrégats calculés sur les parties **terminées** et **arrêtées** de la compagnie, hors parties supprimées. La date d'une partie est celle de l'historique : date programmée, sinon de démarrage, sinon de création. Une partie arrêtée avant d'avoir démarré n'est pas un abandon : elle n'est comptée nulle part. L'intervalle `[from, to)` est semi-ouvert : borne basse incluse, borne haute exclue.

        Période par défaut : les 30 jours avant `to` ; sans `to`, jusqu'à maintenant. Plafond : 366 jours (à une heure près, pour un changement d'heure). Une période vide, inversée ou trop longue répond `400 stats_period_invalid`.

        `tz` est un nom de fuseau IANA (`Europe/Paris`, `UTC`), celui du navigateur ; il ne sert qu'à ranger les créneaux (jour de la semaine et heure locale, changements d'heure compris). Absent : `UTC`. Seuls les noms que PostgreSQL connaît (`pg_timezone_names`) sont acceptés, sans tenir compte de la casse : un nom inconnu, ou un décalage (`+02:00`), répond `400 stats_timezone_invalid`.

        Indicateurs : sessions terminées et arrêtées (par salle), taux d'abandon, durée réelle médiane, joueurs accueillis (un pupitre plus son second joueur nommé, sessions terminées seulement) et moyenne par session, part des joueurs qui laissent un e-mail et part qui accepte les offres, e-mails fidèles (vus dans au moins deux sessions, après normalisation), dix créneaux les plus chargés. Les taux sont des fractions de 0 à 1, `null` quand le dénominateur est nul.

        Aucune donnée personnelle dans la réponse : ni nom, ni adresse e-mail.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie ; le rôle `user` est refusé.
      operationId: getCompanyStats
      x-availability: disponible
      x-us: 'US-STATS-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - name: from
          in: query
          required: false
          description: Début de période inclus, instant ISO 8601 avec fuseau. L'année 0 est refusée, y compris ramenée en UTC par le décalage.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Fin de période exclue, instant ISO 8601 avec fuseau. Pour inclure un jour entier, passer le début du jour suivant. L'année 0 est refusée, y compris ramenée en UTC par le décalage.
          schema:
            type: string
            format: date-time
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: tz
          in: query
          required: false
          description: Fuseau IANA des créneaux (défaut `UTC`).
          schema:
            type: string
            maxLength: 64
            example: Europe/Paris
      responses:
        '200':
          description: Statistiques de la période
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyStats'
        '400':
          description: Paramètre invalide (`invalid_params`), période invalide (`stats_period_invalid`) ou fuseau inconnu (`stats_timezone_invalid`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit (rôle `user`, ou autre compagnie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/config:
    put:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Enregistrer la configuration matérielle de la salle'
      description: |
        Statut : **Disponible**

        Le PC de la salle enregistre sa configuration matérielle (buzzers appris, lumières, fumée)
        dans `rooms.config`. Les sections de premier niveau envoyées remplacent celles du même nom, les autres sont gardées (réglages faits depuis le backoffice). Elle se relit avec `GET /room/me`.
        Objet JSON de 20 000 caractères au plus. `desksCount`, s'il est présent, est un entier de 1 à 6
        (nombre de pupitres de la salle, 4 par défaut).

        **Révision** : `rooms.config_revision` (`configRevision` dans la salle) augmente de 1 à chaque
        écriture de `config`. Avec `revision` (celle lue avec `GET /room/me`), l'écriture n'a lieu que si
        la config n'a pas changé depuis : sinon `409 room_config_conflict` avec la config et la révision
        courantes, et rien n'est écrit. Sans `revision`, l'ancien comportement est conservé (la config est
        écrasée et la révision augmente).

        Accès : réservé au rôle `room`.
      operationId: updateRoomConfig
      x-availability: disponible
      x-us: 'US-ROOM-02'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  additionalProperties: true
                revision:
                  type: integer
                  minimum: 0
                  description: >-
                    Révision de la config lue (`configRevision`). Facultative : absente, l'écriture
                    n'est pas contrôlée.
      responses:
        '200':
          description: Salle mise à jour, avec la nouvelle révision dans `room.configRevision`
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
        '409':
          description: >-
            Un autre poste a modifié la config depuis la lecture (`room_config_conflict`). La config
            courante et sa révision sont renvoyées pour que le poste les recharge ; rien n'est écrit.
          content:
            application/json:
              schema:
                type: object
                required: [error, config, configRevision]
                properties:
                  error:
                    type: string
                    example: room_config_conflict
                  config:
                    type: object
                    additionalProperties: true
                  configRevision:
                    type: integer
                    example: 5
        '400':
          description: Configuration invalide ou trop grande (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle supprimée (`not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/games/current:
    get:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Partie courante de la salle'
      description: |
        Statut : **Disponible**

        Partie en attente ou en cours de la salle du compte connecté, ou `null`. Les emails des participants ne sont pas renvoyés.

        **À venir (lot 13)** : la réponse gagnera `next`, la session `scheduled` la plus proche de la salle dont la fin prévue (`scheduledEndAt`) est dans le futur, au même format que `game` (noms seulement, aucun email), ou `null`.

        Accès : réservé au rôle `room`.
      operationId: getCurrentRoomGame
      x-availability: disponible
      x-us: 'US-GAME-08'
      responses:
        '200':
          description: Partie courante
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/RoomGame'
                    nullable: true
                  next:
                    allOf:
                      - $ref: '#/components/schemas/RoomGame'
                    nullable: true
                    description: '**À venir (lot 13).** Prochaine session programmée de la salle.'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/games/current/content:
    get:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Catalogue jouable de la partie courante'
      description: |
        Statut : **Disponible**

        Thèmes actifs lisibles par la compagnie (global ou company), au format `EngineTheme` du
        moteur de jeu, avec leurs questions actives de tous types et leurs réponses actives. Une
        question **audio** n'est retenue que si son fichier est uploadé (`mediaUrl` = chemin relatif
        à l'API, `/room/questions/{id}/media`) ou si son titre d'un fournisseur d'extraits répond
        avec un extrait ; une image / vidéo que si elle a un lien (`mediaUrl` = ce lien) ; sans
        média, `mediaUrl` vaut `null`. Le moteur trie ensuite les questions par éligibilité de
        chaque mini-jeu. Les thèmes sans question jouable sont écartés.

        Extrait de fournisseur : le serveur demande le titre au fournisseur à chaque appel (un
        appel par titre, sans cache ; 5 appels simultanés au plus). `mediaUrl` est alors le lien
        d'extrait à jour, une URL absolue `https://…` signée et à durée de vie courte : la salle
        la télécharge elle-même, le serveur ne stocke ni ne relaie l'audio. `mediaCredit` décrit
        le titre (`null` pour toutes les autres questions). Fournisseur indisponible, titre
        introuvable ou sans extrait : la question est écartée du catalogue et la réponse reste 200
        (un seul avertissement journalisé par appel). Dès la première indisponibilité du
        fournisseur, les titres restants ne sont plus demandés : leurs questions sont écartées.

        Paramètre `ids` : limite le catalogue à ces questions (reprise d'une partie enregistrée,
        pour ne redemander au fournisseur que les extraits dont le lien a expiré). Elles restent
        filtrées par la compagnie de la salle : un identifiant d'une autre compagnie, ou d'une
        question non jouable, est simplement absent de la réponse.

        Accès : réservé au rôle `room`, uniquement pendant une partie en attente ou en cours.
      operationId: getCurrentRoomGameContent
      x-availability: disponible
      x-us: 'US-GAME-08'
      parameters:
        - name: ids
          in: query
          required: false
          description: 'Identifiants de questions séparés par des virgules (entiers positifs, 200 au plus).'
          schema:
            type: string
            example: '12,14,31'
      responses:
        '200':
          description: Catalogue de la salle
          content:
            application/json:
              schema:
                type: object
                properties:
                  themes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        questions:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              text: { type: string }
                              kind: { type: string, enum: [qcm, true_false, estimate] }
                              mediaType: { type: string, example: audio }
                              mediaUrl:
                                {
                                  type: string,
                                  nullable: true,
                                  description: "Audio importé : chemin relatif à l'API. Audio d'un fournisseur d'extraits : URL absolue https à jour. Image / vidéo : lien.",
                                  example: /room/questions/12/media,
                                }
                              mediaStartMs: { type: integer }
                              mediaCredit:
                                type: object
                                nullable: true
                                description: Extrait fourni par un fournisseur d'extraits ; `null` sinon
                                properties:
                                  provider: { type: string, enum: [deezer] }
                                  title: { type: string }
                                  artist: { type: string }
                                  coverUrl: { type: string, nullable: true }
                                  link: { type: string, nullable: true }
                              answers:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    text: { type: string }
                                    isCorrect: { type: boolean }
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Paramètre `ids` invalide (`invalid_query`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pas de partie courante (`game_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/questions/{questionId}/media:
    get:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Extrait audio d'une question pour la salle"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Même flux et mêmes en-têtes que `GET /questions/{questionId}/media` (`ETag`,
        `Cache-Control: private, no-cache`, `Vary: Authorization`, 304 sur `If-None-Match`).
        La question doit être active, audio, avec un fichier, et lisible par la compagnie.

        Accès : réservé au rôle `room`, uniquement pendant une partie en attente ou en cours.
      operationId: getRoomQuestionMedia
      x-availability: disponible
      x-us: 'US-MEDIA-01'
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Fichier audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
        '304':
          description: Fichier inchangé (ETag identique)
        '400':
          description: Id invalide (`question_id_invalid`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pas de partie courante (`game_not_found`) ou extrait indisponible (`question_media_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/games/{gameId}/open:
    post:
      tags:
        - Rooms
      summary: '[NON DISPONIBLE] Ouvrir une session programmée de la salle'
      description: |
        Statut : **Non disponible** (à venir, lot 13)

        Passe une session `scheduled` de la salle à l'état `pending` (bouton « Lancer » de l'écran de salle). Mêmes règles et mêmes codes que `POST /companies/{companyId}/games/{gameId}/open`, avec le même traitement côté serveur.

        Accès : réservé au rôle `room`, limité à sa propre salle (une autre salle : `404`).
      operationId: openRoomGame
      x-availability: non_disponible
      x-us: 'Lot 13 / sessions programmées'
      parameters:
        - $ref: '#/components/parameters/GameIdParam'
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: '#/components/schemas/RoomGame'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partie introuvable ou d'une autre salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session pas à l'état `scheduled` (`game_not_scheduled`), ouverture à plus de 60 minutes du début (`session_not_open_yet`), partie déjà en attente ou en cours (`room_busy`), salle inactive (`room_inactive`) ou compagnie inactive (`company_inactive`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/games/{gameId}/start:
    post:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Démarrer la partie (accusé de réception)'
      description: |
        Statut : **Disponible**

        La salle accuse réception de la partie lancée : `pending` → `running`, `startedAt` renseigné. Idempotent si la partie tourne déjà.

        Accès : réservé au rôle `room`.
      operationId: startRoomGame
      x-availability: disponible
      x-us: 'US-GAME-08'
      parameters:
        - $ref: '#/components/parameters/GameIdParam'
      responses:
        '200':
          description: Partie démarrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/RoomGame'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pas de partie courante avec cet id (`game_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/games/{gameId}/finish:
    post:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Terminer la partie et enregistrer les scores'
      description: |
        Statut : **Disponible**

        Envoyé par l'écran de salle au podium : la partie passe `finished` (`finishedAt` renseigné) et le score de chaque pupitre est enregistré (une ligne par pupitre inscrit, ni plus ni moins). Idempotent : une partie déjà terminée est renvoyée telle quelle, sans toucher aux scores.

        Accès : réservé au rôle `room`, partie de sa salle uniquement.
      operationId: finishRoomGame
      x-availability: disponible
      x-us: 'US-GAME-08'
      parameters:
        - $ref: '#/components/parameters/GameIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                scores:
                  type: array
                  maxItems: 6
                  description: Un score par pupitre ; deux lignes pour le même pupitre sont refusées (`400 invalid_body`)
                  items:
                    type: object
                    required: [podium, score]
                    properties:
                      podium:
                        type: integer
                        minimum: 1
                        maximum: 6
                      score:
                        type: integer
                        minimum: -1000000
                        maximum: 1000000
      responses:
        '200':
          description: Partie terminée
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/RoomGame'
        '400':
          description: Corps invalide (`invalid_body`) ou scores ne couvrant pas exactement les pupitres inscrits (`game_scores_invalid`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pas de partie de cette salle avec cet id (`game_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Partie annulée (`game_already_over`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/stream:
    get:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Flux temps réel de la salle (SSE)'
      description: |
        Statut : **Disponible**

        Le PC de la salle ouvre ce flux `text/event-stream` et le garde ouvert. Une seule instance par salle : un nouveau flux remplace l'ancien, qui reçoit `replaced` puis est fermé.

        Événements (`event:` puis `data:` en JSON) :
        - `hello` : toujours le premier, `{ streamId, heartbeatMs, statusEveryMs }`. `streamId` est à renvoyer dans `POST /room/status`.
        - `replaced` : un autre poste de la salle a ouvert son flux ; celui-ci est fermé juste après.
        - `session_ended` : la session n'est plus valable (`{ error }`) ; le flux est fermé juste après.

        Une ligne de commentaire `: ping` est écrite toutes les 15 s. La session est revérifiée toutes les 60 s sans être prolongée.

        Accès : réservé au rôle `room`.

        Mémoire du processus : le hub ne sert qu'une instance du backend (voir le commentaire de `backend/src/live/hub.ts`).
      operationId: openRoomStream
      x-availability: disponible
      x-us: 'US-LIVE-01'
      responses:
        '200':
          description: Flux d'événements ouvert
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Non connecté ou session invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/status:
    post:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Publier l'état de la salle"
      description: |
        Statut : **Disponible**

        Rapport d'état envoyé par l'écran de salle toutes les `statusEveryMs` (15 s) et à chaque changement. Sans rapport depuis 45 s, la salle est considérée hors ligne. Le personnel de la compagnie le reçoit sur `GET /companies/{companyId}/live`. Aucun e-mail ni donnée de joueur dans le rapport.

        Si `streamId` est fourni et qu'un autre flux est ouvert pour la salle (un autre poste a pris la place), la réponse est `409 room_instance_replaced`. Si la salle n'a plus aucun flux ouvert (redémarrage du backend, coupure réseau), le rapport est accepté (`204`).

        Accès : réservé au rôle `room`.
      operationId: postRoomStatus
      x-availability: disponible
      x-us: 'US-LIVE-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [screen, gameId, phase, round, questionIndex, miniGame, paused, scores, audioReady]
              properties:
                streamId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Identifiant reçu dans l'événement `hello`
                screen:
                  type: string
                  enum: [launch, lobby, play, setup, other]
                gameId:
                  type: integer
                  minimum: 1
                  nullable: true
                phase:
                  type: string
                  nullable: true
                  enum:
                    - lobby
                    - round_intro
                    - theme_choice
                    - question
                    - reveal
                    - round_summary
                    - finished
                    - aborted
                  description: >-
                    Phase du moteur de jeu (liste `GAME_PHASES` de `@quizzup/shared`). Une valeur
                    texte que le serveur ne connaît pas (écran de salle plus récent) est lue comme
                    `null` : le rapport n'est pas refusé.
                round:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  nullable: true
                questionIndex:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  nullable: true
                miniGame:
                  type: string
                  nullable: true
                  enum:
                    - flash_blind_test
                    - quick_answer
                    - first_buzz
                    - true_false
                    - double_or_nothing
                    - sudden_death
                    - point_steal
                    - streak
                    - estimate
                    - progressive_reveal
                paused:
                  type: boolean
                scores:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [podium, score]
                    properties:
                      podium:
                        type: integer
                        minimum: 1
                        maximum: 6
                      score:
                        type: integer
                        minimum: -1000000
                        maximum: 1000000
                audioReady:
                  type: boolean
      responses:
        '204':
          description: Rapport pris en compte
        '400':
          description: Corps invalide (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non connecté ou session invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Un autre flux est ouvert pour la salle, ce poste a été remplacé (`room_instance_replaced`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/logs:
    post:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Envoyer les journaux d'erreurs de la salle"
      description: |
        Statut : **Disponible**

        Envoyé par l'écran de salle : erreurs regroupées (`occurrences`), 50 entrées au plus par envoi, toutes les 30 s environ. La salle et la compagnie viennent du jeton, jamais du corps. Une date `occurredAt` dans le futur est ramenée à l'heure du serveur.

        Aucun e-mail ni donnée de joueur : le serveur masque toute adresse (`[email]`) avant de couper le texte à 300 caractères, et ne garde du `context` que les clés `route`, `phase`, `miniGame`, `desk`, `driver` et `httpStatus` (texte de 64 caractères au plus ou nombre). Les autres clés sont écartées.

        Conservation : 30 jours (`ROOM_LOG_RETENTION_DAYS`) et 5000 lignes par salle au plus ; le nettoyage a lieu à chaque envoi. Limite : 6 envois par minute et par salle, les corps invalides compris. Corps de 128 Ko au plus.

        Accès : réservé au rôle `room`.
      operationId: postRoomLogs
      x-availability: disponible
      x-us: 'US-LOG-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appVersion, entries]
              properties:
                appVersion:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Version de l'écran de salle
                  example: 0.1.0
                entries:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/RoomLogEntry'
      responses:
        '204':
          description: Journaux enregistrés
        '400':
          description: Corps invalide (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non connecté ou session invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle du compte introuvable ou supprimée (`not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Corps de plus de 128 Ko (`payload_too_large`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plus de 6 envois par minute pour cette salle (`too_many_requests`)
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: too_many_requests

  /companies/{companyId}/live:
    get:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Flux temps réel des salles d'une compagnie (SSE)"
      description: |
        Statut : **Disponible**

        Le personnel ouvre ce flux `text/event-stream` pour suivre ses salles en direct.

        Événements (`event:` puis `data:` en JSON) :
        - `snapshot` : toujours le premier, `{ rooms: RoomLive[] }` pour toutes les salles actives de la compagnie, y compris hors ligne.
        - `room_status` : un `RoomLive` à chaque rapport, ouverture ou fermeture du flux d'une salle, et quand une salle passe hors ligne. Un client ignore un `roomId` absent de son instantané (salle supprimée ou désactivée depuis).
        - `session_ended` : la session n'est plus valable (`{ error }`) ; le flux est fermé juste après.

        `RoomLive` : `{ roomId, presence, controllable, lastSeenAt, status }`. `presence` vaut `offline` (aucun rapport depuis 45 s), `in_game` (en ligne, partie en cours, phase hors `lobby`, `finished`, `aborted`) ou `online`. `controllable` : en ligne et flux de la salle ouvert. `lastSeenAt` : date (ISO 8601) du dernier rapport de `POST /room/status`. `status` : ce dernier rapport, conservé tant que le backend tourne même quand la salle est hors ligne (pour afficher « vue pour la dernière fois »). Les deux valent `null` si la salle n'a envoyé aucun rapport depuis le démarrage du backend.

        Une ligne de commentaire `: ping` est écrite toutes les 15 s. La session est revérifiée toutes les 60 s sans être prolongée. 5 flux ouverts au plus par compte.

        Accès : droit `game:read`, compagnie du compte (le superadmin lit toutes les compagnies).
      operationId: openCompanyLiveStream
      x-availability: disponible
      x-us: 'US-LIVE-01'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      responses:
        '200':
          description: Flux d'événements ouvert
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Identifiant de compagnie invalide (`invalid_params`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non connecté ou session invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Rôle sans droit de lecture ou autre compagnie (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Déjà 5 flux ouverts pour ce compte (`too_many_streams`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

