      summary: '[DISPONIBLE] Salle du compte connecté'
      description: |
        Statut : **Disponible**

        Renvoie la salle (avec sa configuration matérielle) et la compagnie du compte de salle connecté. La salle porte aussi `schedule` (`null` sans créneaux), qui donne le fuseau d'affichage des sessions programmées.

        Accès : réservé au rôle `room`.
      operationId: getCurrentRoom
