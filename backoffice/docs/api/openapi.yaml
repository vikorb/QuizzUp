components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: Identifiant de la compagnie
      schema:
        type: integer
        example: 1

    RoomIdParam:
      name: roomId
      in: path
      required: true
      description: Identifiant de la salle
      schema:
        type: integer
        example: 1

    GameIdParam:
      name: gameId
      in: path
      required: true
      description: Identifiant de la partie
      schema:
        type: integer
        example: 1

    CompanyIdParam:
      name: companyId
      in: path
      required: true
      description: Identifiant de la compagnie
      schema:
        type: integer
        example: 1

    AdminId:
      name: adminId
      in: path
      required: true
      description: Identifiant du compte administrateur
      schema:
        type: integer
        example: 1

    QuestionId:
      name: questionId
      in: path
      required: true
      description: Identifiant de la question
      schema:
        type: integer
        example: 1

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    QuestionMediaFile:
      type: object
      description: Fichier audio uploadé sur une question (la clé de stockage n'est jamais exposée)
      properties:
        url:
          type: string
          description: URL protégée de lecture, relative à l'API
          example: /questions/12/media?v=3f6c2a8e-9b1d-4c47-8e2f-5a0d7c1b9e44
        mimeType:
          type: string
          enum: [audio/mpeg, audio/ogg]
        sizeBytes:
          type: integer
          example: 482113
        durationMs:
          type: integer
          nullable: true
          example: 31000
        originalName:
          type: string
          nullable: true
          example: extrait.mp3
        uploadedAt:
          type: string
          format: date-time
          nullable: true

    Question:
      type: object
      properties:
        id:
          type: integer
        adminId:
          type: integer
        companyId:
          type: integer
          nullable: true
        scope:
          type: string
          enum: [global, company]
        question:
          type: string
        typeMedia:
          type: string
          enum: [none, image, audio, video]
        kind:
          type: string
          enum: [qcm, true_false, estimate]
          default: qcm
          description: |
            Type de question, utilisé par le moteur pour l'éligibilité des mini-jeux (`question_kind_invalid` sinon).
            Règles de réponses : `true_false` = exactement « Vrai » et « Faux », une seule juste
            (`question_true_false_answers_invalid`) ; `estimate` = 3 ou 4 fourchettes commençant par
            un nombre (« Moins de 100 », « 100 à 199 »), une seule juste (`question_estimate_answers_invalid`).
            Changer le type revalide les réponses existantes (actives ou en brouillon). Les routes
            unitaires `/questions/{questionId}/answers…` appliquent les mêmes règles à l'état final.
            Préfixes de fourchette reconnus : moins de, plus de, entre, de, environ, au moins, au plus,
            jusqu'à, avant, après, ou un symbole (<, >, ≤, ≥, ~).
            `true_false` et `estimate` n'acceptent que `typeMedia` `none` ou `image`
            (`question_kind_media_invalid` sinon) ; en modification, le champ non envoyé est pris en base.
        mediaUrl:
          type: string
          nullable: true
          description: Lien externe (image / vidéo). Vidé quand un fichier audio est uploadé.
        mediaStartMs:
          type: integer
          minimum: 0
          description: Point de départ de l'extrait audio, en ms
        mediaFile:
          allOf:
            - $ref: '#/components/schemas/QuestionMediaFile'
          nullable: true
        status:
          type: integer
          enum: [0, 1, 2, 3]
        themeIds:
          type: array
          items:
            type: integer
        canEdit:
          type: boolean

    UpdateQuestionRequest:
      type: object
      description: Tous les champs sont optionnels (seuls les champs du blind test sont détaillés)
      properties:
        question:
          type: string
        themeIds:
          type: array
          items:
            type: integer
        typeMedia:
          type: string
          enum: [none, image, audio, video]
        kind:
          type: string
          enum: [qcm, true_false, estimate]
          default: qcm
          description: |
            Type de question, utilisé par le moteur pour l'éligibilité des mini-jeux (`question_kind_invalid` sinon).
            Règles de réponses : `true_false` = exactement « Vrai » et « Faux », une seule juste
            (`question_true_false_answers_invalid`) ; `estimate` = 3 ou 4 fourchettes commençant par
            un nombre (« Moins de 100 », « 100 à 199 »), une seule juste (`question_estimate_answers_invalid`).
            Changer le type revalide les réponses existantes (actives ou en brouillon). Les routes
            unitaires `/questions/{questionId}/answers…` appliquent les mêmes règles à l'état final.
            Préfixes de fourchette reconnus : moins de, plus de, entre, de, environ, au moins, au plus,
            jusqu'à, avant, après, ou un symbole (<, >, ≤, ≥, ~).
            `true_false` et `estimate` n'acceptent que `typeMedia` `none` ou `image`
            (`question_kind_media_invalid` sinon) ; en modification, le champ non envoyé est pris en base.
        mediaUrl:
          type: string
          nullable: true
        mediaStartMs:
          type: integer
          minimum: 0
          description: |
            Point de départ de l'extrait en ms. Doit être un entier positif, inférieur à la
            durée du fichier si elle est connue (`question_media_start_invalid`,
            `question_media_start_out_of_range`) ; refusé sans fichier (`question_media_not_found`).
            Passer `typeMedia` à une autre valeur que `audio` détache et supprime le fichier.
          example: not_found

    ValidationError:
      type: object
      description: Erreur de validation retournée par Zod ou par l'API
      additionalProperties: true

    Status:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Statut :
        - `0` : inactif
        - `1` : actif
        - `2` : supprimé

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email ou nom d'utilisateur
          example: admin@quizzup.fr
        password:
          type: string
          format: password
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        admin:
          $ref: '#/components/schemas/AuthAdmin'

    AuthAdmin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        role:
          type: string
          example: admin
        firstname:
          type: string
          example: Enzo
        lastname:
          type: string
          example: Drissi
        username:
          type: string
          example: enzod
        email:
          type: string
          format: email
          example: enzo@quizzup.fr

    MeAdmin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        role:
          type: string
          example: admin
        firstname:
          type: string
          nullable: true
          example: Enzo
        lastname:
          type: string
          nullable: true
          example: Drissi
        username:
          type: string
          example: enzod
        email:
          type: string
          format: email
          example: enzo@quizzup.fr
        status:
          $ref: '#/components/schemas/Status'
        created_at:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'

    Company:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: QuizzUp
        email:
          type: string
          format: email
          example: contact@quizzup.fr
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        accountsCount:
          type: integer
          example: 3

    CreateCompanyRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: QuizzUp
        email:
          type: string
          format: email
          maxLength: 255
          example: contact@quizzup.fr

    UpdateCompanyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: QuizzUp
        email:
          type: string
          format: email
          maxLength: 255
          example: contact@quizzup.fr
        status:
          $ref: '#/components/schemas/Status'

    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Status'

    DeleteCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        deleted:
          type: object
          properties:
            companyId:
              type: integer
              example: 1
            adminsCount:
              type: integer
              example: 0
            companiesCount:
              type: integer
              example: 1

    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        companyId:
          type: integer
          example: 1
        name:
          type: string
          example: Salle Néon
        config:
          type: object
          additionalProperties: true
          description: >-
            Configuration matérielle (buzzers, lumières, fumée), JSON libre de 20 000 caractères max.
            `desksCount` (entier de 1 à 6, 4 par défaut) fixe le nombre de pupitres de la salle.
          example: { desksCount: 4 }
        configRevision:
          type: integer
          minimum: 0
          description: >-
            Révision de `config` : 0 à la création, +1 à chaque écriture (`PUT /room/config`, ou
            `PATCH` du backoffice qui modifie `config`). À renvoyer dans `revision` de `PUT /room/config`.
          example: 3
        status:
          type: integer
          enum: [0, 1, 2]
          description: '`0` inactive, `1` active, `2` supprimée'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: Salle Néon
        config:
          type: object
          additionalProperties: true

    UpdateRoomRequest:
      type: object
      description: Au moins un champ est requis.
      properties:
        name:
          type: string
          maxLength: 255
        config:
          type: object
          additionalProperties: true

    UpdateRoomStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1, 2]

    RoomAccount:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        roomId:
          type: integer
        username:
          type: string
          example: salle-neon
        status:
          type: integer
          enum: [0, 1, 2]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateRoomAccountRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 255
          pattern: "^[\\w.-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 100

    MiniGame:
      type: string
      description: Code d'un mini-jeu du moteur de jeu (voir `MINI_GAMES` dans `@quizzup/shared`)
      enum:
        - flash_blind_test
        - quick_answer
        - first_buzz
        - true_false
        - double_or_nothing
        - sudden_death
        - point_steal
        - streak
        - estimate
        - progressive_reveal

    GameSummary:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        roomId:
          type: integer
        roomName:
          type: string
        adminId:
          type: integer
          description: Opérateur qui a lancé la partie
        roundsCount:
          type: integer
          example: 10
        questionsPerRound:
          type: integer
          example: 10
        miniGames:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MiniGame'
          description: >-
            Mini-jeux tirés au sort à chaque manche, avec la même probabilité (dans l'ordre de
            `MINI_GAMES`). `null` = tous les mini-jeux, y compris les futurs : c'est aussi ce qui est
            enregistré quand la création reçoit la liste complète. À la relecture, les codes
            inconnus sont ignorés et une liste qui devient vide est renvoyée comme `null`.
            Renvoyé aussi par `GET /room/games/current`.
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
        state:
          type: string
          enum: [pending, running, finished, aborted]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: integer
          enum: [0, 1, 2]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        participantsCount:
          type: integer

    GameParticipant:
      type: object
      properties:
        id:
          type: integer
        podium:
          type: integer
          minimum: 1
          maximum: 6
        displayName:
          type: string
        email:
          type: string
          nullable: true
          description: Masqué (`null`) pour le rôle `user`, qui saisit l'email mais ne le relit pas
        consentAt:
          type: string
          format: date-time
          nullable: true
          description: Horodatage du consentement RGPD (obligatoire si un email est renseigné)
        hasEmail:
          type: boolean
          description: Un email est enregistré (même s'il est masqué pour le rôle `user`)
        secondPlayer:
          allOf:
            - $ref: '#/components/schemas/GameSecondPlayer'
          nullable: true
        score:
          type: integer
          description: Score du pupitre, partagé par ses joueurs

    GameSecondPlayer:
      type: object
      description: 2e joueur facultatif du pupitre, avec son propre email RGPD
      properties:
        displayName:
          type: string
        email:
          type: string
          nullable: true
          description: Masqué (`null`) pour le rôle `user`
        hasEmail:
          type: boolean
        consentAt:
          type: string
          format: date-time
          nullable: true

    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/GameParticipant'

    RoomGame:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          properties:
            participants:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  podium:
                    type: integer
                  displayName:
                    type: string
                  secondDisplayName:
                    type: string
                    nullable: true
                    description: 2e joueur facultatif du pupitre
                  score:
                    type: integer

    CreateGameRequest:
      type: object
      required: [roomId, participants]
      properties:
        roomId:
          type: integer
        roundsCount:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        questionsPerRound:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        miniGames:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MiniGame'
          description: >-
            Mini-jeux autorisés pour la partie. Facultatif : omis, la partie les autorise tous
            (stocké `null`) ; la liste complète est elle aussi enregistrée comme `null`, pour
            inclure d'office les futurs mini-jeux. Un code inconnu, un doublon ou un tableau
            vide donnent `400 invalid_body`.
        participants:
          type: array
          minItems: 1
          maxItems: 6
          description: >-
            Au plus autant de participants que la salle a de pupitres (`desksCount`, 4 par défaut,
            6 au maximum) ; un pupitre au-delà donne `400 podium_not_in_room`.
          items:
            type: object
            required: [podium, displayName]
            properties:
              podium:
                type: integer
                minimum: 1
                maximum: 6
              displayName:
                type: string
                maxLength: 100
              email:
                type: string
                format: email
                nullable: true
              emailConsent:
                type: boolean
                description: Case RGPD cochée explicitement ; requise si `email` est renseigné
              secondPlayer:
                type: object
                nullable: true
                description: 2e joueur facultatif du pupitre (même score que le 1er)
                required: [displayName]
                properties:
                  displayName:
                    type: string
                    maxLength: 100
                  email:
                    type: string
                    format: email
                    nullable: true
                  emailConsent:
                    type: boolean
                    description: Requise si `email` est renseigné

    Account:
      type: object
      properties:
        id:
          type: integer
          example: 1
        companyId:
          type: integer
          example: 1
        role:
          type: string
          example: admin
        firstname:
          type: string
          nullable: true
          example: Enzo
        lastname:
          type: string
          nullable: true
          example: Drissi
        username:
          type: string
          example: enzod
        email:
          type: string
          format: email
          example: enzo@quizzup.fr
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-19T10:00:00.000Z'
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    CreateAccountRequest:
      type: object
      required:
        - role
        - username
        - email
        - password
      properties:
        role:
          type: string
          minLength: 2
          maxLength: 50
          example: staff
        firstname:
          type: string
          nullable: true
          maxLength: 255
          example: Enzo
        lastname:
          type: string
          nullable: true
          maxLength: 255
          example: Drissi
        username:
          type: string
          minLength: 3
          maxLength: 255
          example: enzod
        email:
          type: string
          format: email
          maxLength: 255
          example: enzo@quizzup.fr
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          example: password123

    UpdateAccountRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          minLength: 2
          maxLength: 50
          example: staff
        firstname:
          type: string
          nullable: true
          maxLength: 255
          example: Enzo
        lastname:
          type: string
          nullable: true
          maxLength: 255
          example: Drissi
        username:
          type: string
          minLength: 3
          maxLength: 255
          example: enzod
        email:
          type: string
          format: email
          maxLength: 255
          example: enzo@quizzup.fr
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          example: newPassword123
        status:
          $ref: '#/components/schemas/Status'
