      summary: '[DISPONIBLE] Ouvrir une session programmée'
      description: |
        Statut : **Disponible**

        Passe une session `scheduled` à l'état `pending`, comme si l'opérateur l'avait lancée. Possible dès 60 minutes avant le début ; il n'y a pas de borne de fin : une session non lancée, même après son créneau, peut toujours être ouverte. Rien ne démarre seul : l'ouverture est toujours faite par une personne.

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie.
      operationId: openCompanyGame
      x-availability: disponible
      x-us: 'Lot 13 / sessions programmées'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/GameIdParam'
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/GameDetail'
        '400':
          description: Identifiants invalides (`invalid_params`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session pas à l'état `scheduled` (`game_not_scheduled`), ouverture à plus de 60 minutes du début (`session_not_open_yet`), partie déjà en attente ou en cours dans la salle (`room_busy`), salle inactive (`room_inactive`) ou compagnie inactive (`company_inactive`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/games/{gameId}/abort:
