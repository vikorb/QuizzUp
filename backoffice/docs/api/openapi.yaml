openapi: 3.0.3

info:
  title: QuizzUp Backoffice API
  version: 1.0.0
  description: |
    Documentation API du backoffice QuizzUp.

    Chaque route contient un champ `x-availability` :
    - `disponible` : route implémentée côté API
    - `non_disponible` : route prévue mais pas encore implémentée

    **Compte superadmin (console éditeur).** Il ne peut se connecter et appeler l'API que depuis les
    adresses listées dans la variable `CONSOLE_ALLOWED_CIDRS` (adresse vue par l'API : `req.ip`,
    réglée par `TRUST_PROXY`). Variable vide ou absente : aucune adresse, le superadmin est refusé
    partout. Hors de ces adresses :
    - `POST /login` répond `401 invalid_credentials`, comme pour un mauvais mot de passe, sans créer
      de session ;
    - toute route protégée, y compris les flux en direct, répond `403 forbidden` à son jeton, même
      valide. Cela vaut pour toutes les routes, pas seulement celles réservées au superadmin, sauf
      `POST /logout`, qui révoque la session où que soit l'appelant.

    **Double authentification du superadmin.** Pour un superadmin, `POST /login` ne crée pas de session :
    il rend un jeton de défi (`challengeToken`, 5 minutes, inutilisable comme jeton porteur) et l'étape
    à suivre, `totp` (saisir le code de l'application) ou `enroll` (première connexion : enrôler
    l'application). Les routes `/login/totp*` ne sont servies qu'aux adresses de `CONSOLE_ALLOWED_CIDRS`
    (`403 forbidden` sinon), avec une limite de 10 requêtes par minute et par adresse. Un code faux et un
    code déjà utilisé reçoivent exactement la même réponse `401 totp_invalid` ; après 5 échecs le compte est
    bloqué 15 minutes (`429 too_many_attempts`, même avec le bon code). Sans `TOTP_ENCRYPTION_KEY` valide,
    le superadmin ne peut plus se connecter (`503 totp_unavailable`).

    Les autres rôles ne sont pas concernés.

servers:
  - url: http://localhost:3001
    description: API locale

tags:
  - name: Health
    description: Vérification de disponibilité de l'API
  - name: Auth
    description: Authentification administrateur
  - name: Me
    description: Informations de l'utilisateur connecté
  - name: Companies
    description: Gestion des compagnies
  - name: Accounts
    description: Gestion des comptes administrateurs rattachés aux compagnies
  - name: Rooms
    description: Salles de jeu d'une compagnie et leur configuration matérielle
  - name: Games
    description: Parties lancées par l'opérateur dans une salle
  - name: Stats
    description: Statistiques d'exploitation d'une compagnie (agrégats, aucun joueur)
  - name: DemoRequests
    description: Demandes de démonstration reçues de la vitrine, consultées dans la console de l'éditeur
  - name: Public
    description: |
      API publique sous `/public/v1` (vitrine, réservation) : sans compte, sans jeton, sans cookie.
      Routes livrées : `POST /public/v1/demo-requests` (demande de démonstration) et
      `GET /public/v1/logos/{file}` (logo d'un centre). Toutes suivent ces conventions.

      - Erreurs au format `PublicError` : statut HTTP et `{ "error": "<code_snake_case>" }`, avec
        `details.fieldErrors` pour `invalid_body` seulement. Codes communs : `invalid_json` (400),
        `invalid_body` (400), `payload_too_large` (413), `unsupported_media_type` (415),
        `not_found` (404), `too_many_requests` (429), `server_error` (500). Toute autre erreur de
        requête (4xx) détectée par le serveur garde son statut avec le code `bad_request`.
      - Limite de débit par adresse du client (120 requêtes par minute par défaut) : refus en `429`
        avec l'en-tête `Retry-After` (secondes).
      - Réponses jamais mises en cache (`Cache-Control: no-store`), sauf le contenu immuable d'un
        fichier (logo : `public, max-age=31536000, immutable`).
      - CORS réservé aux sites listés dans la variable `VITRINE_ORIGINS` (aucun si elle est vide).

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: "[DISPONIBLE] Vérifier l'état de l'API"
      description: |
        Statut : **Disponible**

        Permet de vérifier que l'API répond correctement.
      operationId: getHealth
      x-availability: disponible
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /login:
    post:
      tags:
        - Auth
      summary: '[DISPONIBLE] Connexion administrateur'
      description: |
        Statut : **Disponible**

        Permet à un administrateur de se connecter avec son email ou son nom d'utilisateur.

        Un **superadmin** dont le mot de passe est juste n'obtient pas de session mais un défi
        (`LoginChallengeResponse`) à compléter par `POST /login/totp` ou `POST /login/totp/enroll`. Les
        autres rôles reçoivent directement `{ token, admin }`.
      operationId: login
      x-availability: disponible
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              loginWithEmail:
                summary: Connexion avec email
                value:
                  identifier: admin@quizzup.fr
                  password: password123
              loginWithUsername:
                summary: Connexion avec username
                value:
                  identifier: admin
                  password: password123
      responses:
        '200':
          description: |
            Connexion réussie (`LoginResponse`), ou, pour un superadmin, défi de double authentification
            (`LoginChallengeResponse`) : aucune session n'est créée à ce stade.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/LoginChallengeResponse'
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: |
            Identifiants invalides. Aussi renvoyé, avec le même corps `invalid_credentials`, à un
            superadmin dont le mot de passe est juste mais dont l'adresse n'est pas dans
            `CONSOLE_ALLOWED_CIDRS` : aucune session n'est créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Trop de tentatives, par adresse (100 par fenêtre de 15 minutes) ou par couple adresse et
            identifiant (10 par fenêtre, casse ignorée) ; seuls les échecs comptent. Une adresse IPv6
            est comptée par bloc /64. Code `too_many_requests`, identique que le compte existe ou
            non. Même route pour le personnel et pour les comptes de salle.
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
                example: 600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: too_many_requests
        '503':
          description: |
            Superadmin dont le mot de passe est juste, alors que `TOTP_ENCRYPTION_KEY` est absente ou
            invalide : code `totp_unavailable`, aucune session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: totp_unavailable

  /login/totp:
    post:
      tags:
        - Auth
      summary: '[DISPONIBLE] Deuxième facteur du superadmin (code TOTP ou code de secours)'
      description: |
        Statut : **Disponible**

        Termine la connexion d'un superadmin enrôlé : le code à 6 chiffres de l'application, ou un code
        de secours (`xxxxx-xxxxx`, usage unique, majuscules, espaces et tiret ignorés). Ouvre la session
        et rend `{ token, admin }` ; avec un code de secours, `recoveryCodesRemaining` donne le nombre de
        codes restants. Réservée aux adresses de `CONSOLE_ALLOWED_CIDRS` (`403 forbidden` sinon).
      operationId: loginTotp
      x-availability: disponible
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpChallengeCodeRequest'
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - type: object
                    properties:
                      recoveryCodesRemaining:
                        type: integer
                        description: Présent seulement quand un code de secours vient d'être utilisé
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: |
            `mfa_challenge_invalid` (défi absent, expiré, altéré, ou compte devenu inactif) ou
            `totp_invalid` (code faux ou déjà utilisé, réponses identiques).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Adresse hors de `CONSOLE_ALLOWED_CIDRS` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Le superadmin n'a pas encore enrôlé d'application (`totp_not_enrolled`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            `too_many_attempts` : compte bloqué après 5 échecs, pour 15 minutes, même avec le bon code ;
            ou `too_many_requests` : plus de 10 requêtes par minute depuis cette adresse.
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Clé de chiffrement absente ou invalide (`totp_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login/totp/enroll:
    post:
      tags:
        - Auth
      summary: "[DISPONIBLE] Enrôler l'application d'authentification (première étape)"
      description: |
        Statut : **Disponible**

        Génère un secret TOTP pour le superadmin du défi (`mfa: 'enroll'`) et le range chiffré
        (AES-256-GCM). Peut être rappelée tant que l'enrôlement n'est pas confirmé : le secret est alors
        remplacé. Le secret n'est rendu qu'ici, en clair, pour être saisi dans l'application ou lu via
        l'adresse `otpauth`. Réservée aux adresses de `CONSOLE_ALLOWED_CIDRS`.
      operationId: loginTotpEnroll
      x-availability: disponible
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpChallengeRequest'
      responses:
        '200':
          description: Secret généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Défi absent, expiré ou altéré (`mfa_challenge_invalid`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Adresse hors de `CONSOLE_ALLOWED_CIDRS` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Enrôlement déjà confirmé (`totp_already_enrolled`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plus de 10 requêtes par minute depuis cette adresse (`too_many_requests`)
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Clé de chiffrement absente ou invalide (`totp_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login/totp/enroll/confirm:
    post:
      tags:
        - Auth
      summary: "[DISPONIBLE] Confirmer l'enrôlement et ouvrir la session"
      description: |
        Statut : **Disponible**

        Vérifie le premier code à 6 chiffres de l'application, active le deuxième facteur, ouvre la
        session et rend les 10 codes de secours **une seule fois** (seules leurs empreintes sont
        conservées). Le code servi ici ne peut plus l'être pour se connecter. Réservée aux adresses de
        `CONSOLE_ALLOWED_CIDRS`.
      operationId: loginTotpEnrollConfirm
      x-availability: disponible
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpChallengeCodeRequest'
      responses:
        '200':
          description: Enrôlement confirmé, session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmResponse'
        '400':
          description: Corps de requête invalide (le code doit compter exactement 6 chiffres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Défi invalide (`mfa_challenge_invalid`) ou code faux (`totp_invalid`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Adresse hors de `CONSOLE_ALLOWED_CIDRS` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Enrôlement non commencé (`totp_not_enrolled`), déjà confirmé (`totp_already_enrolled`) ou
            dont le secret a été régénéré par une autre requête pendant la vérification
            (`totp_enrollment_changed`) : scanner le nouveau secret et saisir un nouveau code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plus de 10 requêtes par minute depuis cette adresse (`too_many_requests`)
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Clé de chiffrement absente ou invalide (`totp_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags:
        - Auth
      summary: '[DISPONIBLE] Déconnexion administrateur'
      description: |
        Statut : **Disponible**

        Révoque la session courante de l'administrateur connecté. Un superadmin hors des adresses de
        la console (`CONSOLE_ALLOWED_CIDRS`) peut aussi fermer sa session : la route ne répond pas
        `403 forbidden` et ne donne accès à rien d'autre.
      operationId: logout
      x-availability: disponible
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags:
        - Me
      summary: "[DISPONIBLE] Récupérer l'utilisateur connecté"
      description: |
        Statut : **Disponible**

        Retourne les informations de l'administrateur connecté à partir du token JWT.
      operationId: getMe
      x-availability: disponible
      responses:
        '200':
          description: Utilisateur connecté récupéré
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    $ref: '#/components/schemas/MeAdmin'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Administrateur introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/totp:
    delete:
      tags:
        - Me
      summary: '[DISPONIBLE] Retirer le deuxième facteur du superadmin'
      description: |
        Statut : **Disponible**

        Réservée au superadmin. Exige un code TOTP ou un code de secours valide, efface le secret et
        les codes de secours et **révoque toutes les sessions** du superadmin, la sienne comprise : la
        prochaine connexion repasse par l'enrôlement. Les échecs comptent pour le blocage de
        15 minutes après 5 échecs.
      operationId: deleteMeTotp
      x-availability: disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '204':
          description: Deuxième facteur retiré
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Token manquant ou invalide, ou code faux (`totp_invalid`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte non superadmin, ou adresse hors de `CONSOLE_ALLOWED_CIDRS` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Aucun deuxième facteur à retirer (`totp_not_enrolled`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Compte bloqué après 5 échecs (`too_many_attempts`)
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Clé de chiffrement absente ou invalide (`totp_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies:
    get:
      tags:
        - Companies
      summary: '[DISPONIBLE] Lister les compagnies'
      description: |
        Statut : **Disponible**

        Liste les compagnies.

        Règles :
        - un admin global peut voir toutes les compagnies ;
        - un compte non admin ne voit que sa propre compagnie si elle n'est pas supprimée.
      operationId: listCompanies
      x-availability: disponible
      responses:
        '200':
          description: Liste des compagnies
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Companies
      summary: '[DISPONIBLE] Créer une compagnie'
      description: |
        Statut : **Disponible**

        Crée une nouvelle compagnie.

        Accès : réservé au rôle `admin`.
      operationId: createCompany
      x-availability: disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Compagnie créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou nom déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{id}:
    get:
      tags:
        - Companies
      summary: '[DISPONIBLE] Récupérer une compagnie'
      description: |
        Statut : **Disponible**

        Récupère une compagnie par son identifiant.

        Règles :
        - un admin global peut accéder à toutes les compagnies ;
        - un compte non admin ne peut accéder qu'à sa propre compagnie.
      operationId: getCompanyById
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Compagnie récupérée
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Companies
      summary: '[DISPONIBLE] Modifier une compagnie'
      description: |
        Statut : **Disponible**

        Modifie une compagnie.

        Accès : réservé au rôle `admin`.
      operationId: updateCompany
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Compagnie modifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou nom déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{id}/status:
    patch:
      tags:
        - Companies
      summary: "[DISPONIBLE] Modifier le statut d'une compagnie"
      description: |
        Statut : **Disponible**

        Met à jour uniquement le statut d'une compagnie.

        Statuts :
        - `0` : inactive
        - `1` : active
        - `2` : supprimée

        Si le statut passe à `2`, `deletedAt` est renseigné.
      operationId: updateCompanyStatus
      x-availability: disponible
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Statut de la compagnie modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Paramètres ou corps de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compagnie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/logo:
    put:
      tags:
        - Companies
      summary: "[DISPONIBLE] Envoyer ou remplacer le logo d'une compagnie"
      description: |
        Statut : **Disponible** (lot 6a)

        Le corps de la requête est le fichier lui-même (pas de multipart). Formats acceptés : PNG,
        JPEG et WebP, 512 Ko au plus. Le type est vérifié sur les premiers octets du fichier : ni
        l'en-tête `Content-Type` ni l'extension ne comptent, et le SVG est refusé (il peut porter
        un script).

        Effets : l'ancien fichier est supprimé du stockage. La réponse donne l'URL publique du
