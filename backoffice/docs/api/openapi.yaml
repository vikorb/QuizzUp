              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/GameDetail'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Games
      summary: '[DISPONIBLE] Modifier une session programmée'
      description: |
        Statut : **Disponible**

        Modifie une session à l'état `scheduled` : `roomId`, `scheduledAt`, `durationMinutes`, `roundsCount`, `questionsPerRound`, `miniGames`, `playersCount`, `externalRef`, `locale`, et `participants` (remplacement complet, dans une transaction). Seul le chevauchement d'une autre session de la salle est interdit. Les contrôles `session_in_past` et `session_too_far` ne s'appliquent que si le début ou la durée change.

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie.
      operationId: updateCompanyGame
      x-availability: disponible
      x-us: 'Lot 13 / sessions programmées'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/GameIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameRequest'
      responses:
        '200':
          description: Session modifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/GameDetail'
        '400':
          description: Corps invalide (`invalid_body`), session dans le passé (`session_in_past`), trop loin (`session_too_far`) ou pupitre absent de la salle (`podium_not_in_room`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partie ou salle introuvable (`not_found`, `room_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partie n'est plus à l'état `scheduled` (`game_not_scheduled`), la salle est inactive (`room_inactive`) ou le créneau chevauche une autre session de la salle (`slot_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/games/{gameId}/cancel:
    post:
      tags:
        - Games
      summary: '[DISPONIBLE] Annuler une session programmée'
      description: |
        Statut : **Disponible**

        Passe une session `scheduled` à l'état `cancelled` (`cancelledAt` renseigné) et libère son créneau. Annuler n'est pas supprimer : `status` reste à `1`. Les emails et les consentements des joueurs de la session sont effacés tout de suite (les noms sont gardés). Idempotent : refaire l'appel sur une session déjà annulée renvoie `200`.

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie.
      operationId: cancelCompanyGame
      x-availability: disponible
      x-us: 'Lot 13 / sessions programmées'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/GameIdParam'
      responses:
        '200':
          description: Session annulée
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/GameDetail'
        '400':
          description: Identifiants invalides (`invalid_params`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partie n'est ni programmée ni déjà annulée (`game_not_scheduled`)
          content:
