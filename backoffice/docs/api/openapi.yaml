  /room/config:
    put:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Enregistrer la configuration matérielle de la salle'
      description: |
        Statut : **Disponible**

        Le PC de la salle enregistre sa configuration matérielle (buzzers appris, lumières, fumée)
        dans `rooms.config`. Les sections de premier niveau envoyées remplacent celles du même nom, les autres sont gardées (réglages faits depuis le backoffice). Elle se relit avec `GET /room/me`.
        Objet JSON de 20 000 caractères au plus. `desksCount`, s'il est présent, est un entier de 1 à 6
        (nombre de pupitres de la salle, 4 par défaut).

        **Révision** : `rooms.config_revision` (`configRevision` dans la salle) augmente de 1 à chaque
        écriture de `config`. Avec `revision` (celle lue avec `GET /room/me`), l'écriture n'a lieu que si
        la config n'a pas changé depuis : sinon `409 room_config_conflict` avec la config et la révision
        courantes, et rien n'est écrit. Sans `revision`, l'ancien comportement est conservé (la config est
        écrasée et la révision augmente).

        Accès : réservé au rôle `room`.
      operationId: updateRoomConfig
      x-availability: disponible
      x-us: 'US-ROOM-02'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  additionalProperties: true
                revision:
                  type: integer
                  minimum: 0
                  description: >-
                    Révision de la config lue (`configRevision`). Facultative : absente, l'écriture
                    n'est pas contrôlée.
      responses:
        '200':
          description: Salle mise à jour, avec la nouvelle révision dans `room.configRevision`
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
        '409':
          description: >-
            Un autre poste a modifié la config depuis la lecture (`room_config_conflict`). La config
            courante et sa révision sont renvoyées pour que le poste les recharge ; rien n'est écrit.
          content:
            application/json:
              schema:
                type: object
                required: [error, config, configRevision]
                properties:
                  error:
                    type: string
                    example: room_config_conflict
                  config:
                    type: object
                    additionalProperties: true
                  configRevision:
                    type: integer
                    example: 5
        '400':
          description: Configuration invalide ou trop grande (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle supprimée (`not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

