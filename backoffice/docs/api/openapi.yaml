          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    allOf:
                      - $ref: '#/components/schemas/RoomAccount'
        '400':
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle introuvable ou supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Compte déjà existant (`room_account_already_exists`) ou identifiant pris (`username_already_exists`) ou compagnie supprimée (`company_deleted`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
