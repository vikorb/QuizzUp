                        type: string
                        nullable: true
                        description: URL publique du logo de la compagnie (`GET /public/v1/logos/{file}`), ou `null`
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle introuvable ou supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/games:
    get:
      tags:
        - Games
      summary: "[DISPONIBLE] Lister les parties d'une compagnie"
      description: |
        Statut : **Disponible**

        Parties de la compagnie, de la plus récente à la plus ancienne (date de la partie, puis identifiant décroissant pour départager les égalités), avec le nom de la salle, le nombre de joueurs nommés, la durée et le meilleur score. Les parties supprimées sont exclues.

        Tous les filtres sont facultatifs et se cumulent. `from` et `to` filtrent la date de la partie, c'est-à-dire le début prévu d'une session programmée (`scheduledAt`), sinon la date de démarrage, sinon la date de création ; l'intervalle est semi-ouvert : borne basse incluse, borne haute exclue. L'année 0 est refusée, y compris ramenée en UTC par le décalage. Il n'y a pas de plafond de période : la pagination borne la réponse. `total` est le nombre de parties qui passent les filtres, quelle que soit la page.

        Chaque ligne porte les champs de session programmée (`scheduledAt`, `scheduledEndAt`, `cancelledAt`, `playersCount`, `externalRef`, `locale`). Le champ `source` (`backoffice` ou `api`) arrive avec le lot 14.

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie.
      operationId: listCompanyGames
      x-availability: disponible
      x-us: 'US-GAME-08'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, pending, running, finished, aborted, cancelled]
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          description: Début de période inclus, instant ISO 8601 avec fuseau (ex. `2026-11-05T00:00:00+01:00` ou `...Z`). L'année 0 est refusée, y compris ramenée en UTC par le décalage.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Fin de période exclue (intervalle semi-ouvert), instant ISO 8601 avec fuseau. Pour inclure un jour entier, passer le début du jour suivant. L'année 0 est refusée, y compris ramenée en UTC par le décalage.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Taille de la page. Une valeur au-dessus de 200 est ramenée à 200.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Page de parties et nombre total de parties filtrées
          content:
            application/json:
              schema:
                type: object
                required: [games, total]
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameSummary'
                  total:
                    type: integer
                    minimum: 0
        '400':
          description: Paramètre ou filtre invalide (`invalid_params`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Games
      summary: '[DISPONIBLE] Lancer une partie'
      description: |
        Statut : **Disponible**

        Crée une partie en attente dans une salle active et libre, avec 1 à 4 participants (un par pupitre). Un email n'est accepté qu'avec `emailConsent: true` (consentement RGPD horodaté dans `consentAt`). Le consentement à recevoir les offres du centre (`marketingConsent`) est distinct : il n'est accepté qu'avec un email, et horodaté par le serveur (`marketingConsent` vaut alors `true` dans la réponse). Format par défaut : 10 manches × 10 questions. La graine de tirage (0 à 2³² − 1) est tirée par le serveur.

        Le corps accepte aussi `scheduledAt`, `durationMinutes`, `playersCount`, `externalRef` et `locale` (voir `CreateGameRequest`). Avec `scheduledAt`, la partie est créée à l'état `scheduled` (participants de 0 à 6, pas de contrôle `room_busy`) ; erreurs propres : 400 `session_in_past` (fin ≤ maintenant), 400 `session_too_far` (début au-delà de 365 jours), 409 `slot_taken` (chevauchement d'une autre session de la salle). Sans `scheduledAt`, rien ne change.

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie.
      operationId: createCompanyGame
      x-availability: disponible
      x-us: 'US-GAME-08'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Partie créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    allOf:
                      - $ref: '#/components/schemas/GameDetail'
        '400':
          description: Corps invalide (dont `email_consent_required`, `marketing_consent_requires_email`, `participants_podium_duplicated`), ou pupitre au-delà du nombre de pupitres de la salle (`podium_not_in_room`, avec `desksCount`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle introuvable (`room_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Compagnie supprimée (`company_deleted`) ou inactive (`company_inactive`), salle inactive (`room_inactive`) ou partie déjà en attente / en cours (`room_busy`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/games/{gameId}:
    get:
      tags:
        - Games
      summary: '[DISPONIBLE] Lire une partie'
      description: |
        Statut : **Disponible**

        Partie avec ses participants.

        Accès : superadmin (toutes les compagnies), `admin` et `user` de la compagnie.
      operationId: getCompanyGame
      x-availability: disponible
