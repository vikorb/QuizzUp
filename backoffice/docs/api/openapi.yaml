          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /companies/{companyId}/rooms/{roomId}/schedule:
    put:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Régler les créneaux d'une salle"
      description: |
        Statut : **Disponible**

        Remplace les réglages de créneaux de la salle (`rooms.schedule`) ; `schedule: null` les désactive (la salle n'est plus réservable). `rooms.config` n'est pas touché : il appartient au PC de salle.

        `schedule` est aussi renvoyé par `GET /companies/{companyId}/rooms*` et par `/room/me`. Un jour absent de `days` est fermé ; `breakMinutes` vaut `0` s'il est omis ; un champ inconnu est ignoré.

        Accès : superadmin (toutes les compagnies) et `admin` de la compagnie ; refusé au rôle `user`.
      operationId: updateRoomSchedule
      x-availability: disponible
      x-us: 'Lot 13 / sessions programmées'
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/RoomIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomScheduleRequest'
      responses:
        '200':
          description: Salle mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
        '400':
          description: >-
            Corps invalide (`invalid_body`, avec détails) ou identifiants invalides (`invalid_params`). Fuseau inconnu
            (`schedule_timezone_invalid`), heure qui n'est pas `HH:MM` (`schedule_time_invalid`), durée ou pause hors bornes,
            `firstSessionAt` hors plage d'ouverture (`schedule_first_session_out_of_range`), jours consécutifs qui se
            chevauchent, le dimanche précédant le lundi (`schedule_days_overlap`) : ces trois codes sont des messages de
            détail du corps, pas des codes d'erreur de premier niveau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salle introuvable (`not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Compagnie supprimée (`company_deleted`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/me:
    get:
      tags:
