  /room/games/current/content:
    get:
      tags:
        - Rooms
      summary: '[DISPONIBLE] Catalogue jouable de la partie courante'
      description: |
        Statut : **Disponible**

        Thèmes actifs lisibles par la compagnie (global ou company), au format `EngineTheme` du
        moteur de jeu, avec leurs questions actives de tous types et leurs réponses actives. Une
        question **audio** n'est retenue que si son fichier est uploadé (`mediaUrl` = chemin relatif
        à l'API, `/room/questions/{id}/media`) ; une image / vidéo que si elle a un lien
        (`mediaUrl` = ce lien) ; sans média, `mediaUrl` vaut `null`. Le moteur trie ensuite les
        questions par éligibilité de chaque mini-jeu. Les thèmes sans question jouable sont écartés.

        Accès : réservé au rôle `room`, uniquement pendant une partie en attente ou en cours.
      operationId: getCurrentRoomGameContent
      x-availability: disponible
      x-us: 'US-GAME-08'
      responses:
        '200':
          description: Catalogue de la salle
          content:
            application/json:
              schema:
                type: object
                properties:
                  themes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        questions:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              text: { type: string }
                              kind: { type: string, enum: [qcm, true_false, estimate] }
                              mediaType: { type: string, example: audio }
                              mediaUrl:
                                { type: string, nullable: true, example: /room/questions/12/media }
                              mediaStartMs: { type: integer }
                              answers:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    text: { type: string }
                                    isCorrect: { type: boolean }
        '403':
          description: Compte qui n'est pas un compte de salle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pas de partie courante (`game_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room/questions/{questionId}/media:
    get:
      tags:
        - Rooms
      summary: "[DISPONIBLE] Extrait audio d'une question pour la salle"
      description: |
        Statut : **Disponible** (US-MEDIA-01)

        Même flux et mêmes en-têtes que `GET /questions/{questionId}/media` (`ETag`,
        `Cache-Control: private, no-cache`, `Vary: Authorization`, 304 sur `If-None-Match`).
