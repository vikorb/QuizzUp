# CI GitHub — garde-fou pré-merge sur les PR.
# La CI complète (Sonar, Lighthouse, deploy) reste côté GitLab et valide `main`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backoffice/package-lock.json
            backoffice/shared/package-lock.json
            backoffice/backend/package-lock.json
            backoffice/frontend/package-lock.json

      - name: Installer les dépendances
        run: |
          npm ci
          npm --prefix shared ci && npm --prefix shared run build
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm test

  migrations:
    name: Migrations Knex (aller-retour)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quizzup
          POSTGRES_PASSWORD: quizzup
          POSTGRES_DB: quizzup_backoffice
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U quizzup -d quizzup_backoffice"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://quizzup:quizzup@localhost:5434/quizzup_backoffice
    defaults:
      run:
        working-directory: backoffice/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backoffice/shared/package-lock.json
            backoffice/backend/package-lock.json

      - name: Installer les dépendances
        run: |
          npm --prefix ../shared ci && npm --prefix ../shared run build
          npm ci

      # Les migrations antérieures au 2026-05-21 n'ont pas un `down` rejouable
      # (ex. 20260307164642_delete_deleted_at) : on ne teste l'aller-retour que
      # des migrations suivantes, sans modifier les migrations déjà partagées.
      - name: Migrer, annuler les migrations récentes, re-migrer
        run: |
          npx knex migrate:latest
          RECENT=$(ls db/migrations | awk -F_ '$1 >= 20260521000000' | wc -l)
          for _ in $(seq "$RECENT"); do npx knex migrate:down; done
          npx knex migrate:latest

      # Purge RGPD des emails joueurs sur un vrai PostgreSQL. Base dédiée : le test applique
      # les migrations et vide les tables, il ne doit pas toucher à la base de l'aller-retour.
      - name: Test d'intégration de la purge RGPD (PostgreSQL)
        working-directory: backoffice
        env:
          PG_INTEGRATION_URL: postgresql://quizzup:quizzup@localhost:5434/quizzup_purge_test
        run: |
          PGPASSWORD=quizzup psql -h localhost -p 5434 -U quizzup -d quizzup_backoffice \
            -c "CREATE DATABASE quizzup_purge_test"
          npm ci
          npx vitest run --config vitest.backend.config.ts \
            tests/backend/src/jobs/purgePlayerEmails.pg.test.ts

  game-engine:
    name: Moteur de jeu (lint, type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/engine/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests et couverture
        run: npm run test:coverage

  room-app:
    name: Écran de salle (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/room-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/room-app/package-lock.json

      # Le moteur et `@quizzup/shared` sont consommés en sources (alias), sans
      # installation : seules les dépendances de l'écran de salle sont nécessaires.
      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build
        run: npm run build

  game-hardware:
    name: Matériel de salle (lint, type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/hardware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/hardware/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests et couverture
        run: npm run test:coverage

  e2e:
    name: Tests de bout en bout (Playwright, Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            game/e2e/package-lock.json
            game/room-app/package-lock.json

      # L'écran de salle tourne en serveur Vite : ses dépendances sont nécessaires. Moteur,
      # audio, matériel et `@quizzup/shared` sont consommés en sources (alias), sans installation.
      - name: Installer les dépendances
        run: |
          npm ci
          npm --prefix ../room-app ci

      - name: Installer Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests de bout en bout
        run: npm test

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            game/e2e/playwright-report
            game/e2e/test-results
          retention-days: 7

  artnet-bridge:
    name: Pont Art-Net (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/artnet-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/artnet-bridge/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build
        run: npm run build
