# Recette QuizzUP sur un serveur (VPS) : base, API, backoffice et écran de salle en HTTPS.
# Lancer depuis la racine du dépôt :
#   docker compose -f deploy/recette/docker-compose.yml --env-file deploy/recette/.env up -d --build
# Guide complet : deploy/recette/README.md

name: quizzup-recette

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizzup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: quizzup_backoffice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzup -d quizzup_backoffice"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../../backoffice
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://quizzup:${POSTGRES_PASSWORD}@postgres:5432/quizzup_backoffice
      API_PORT: "3001"
      CORS_ORIGIN: https://bo.${DOMAIN:?DOMAIN manquant dans .env},https://salle.${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      JWT_EXPIRES_IN: "2h"
      MEDIA_STORAGE_DIR: /data/media
      MEDIA_MAX_BYTES: "10485760"
      ADMIN_SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD manquant dans .env}
      SEED_DEFAULT_PASSWORD: ${SEED_PASSWORD}
      DEMO_SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data/media
      # L'image backend n'embarque pas docs/ : l'API lit openapi.yaml au démarrage (Swagger).
      - ../../backoffice/docs:/workspace/docs:ro
    # Pas de mode watch en recette ; tous les seeds sur base vide, ensuite le seed de démo seul.
    command: sh -c "npm run migrate && npm run seed:if-empty && npx tsx src/server.ts"

  web:
    build:
      context: ../..
      dockerfile: deploy/recette/Dockerfile.web
      args:
        API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media_data:
  caddy_data:
  caddy_config:
